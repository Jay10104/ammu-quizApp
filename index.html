<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ammu Quiz App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FB; --sheet:#FFFFFF; --ink:#111C33; --muted:#6B7690; --line:#E2E7EF;
  --blue:#3A6FF0; --blue-soft:#EDF2FF; --mark:#FFD447; --mark-ink:#3A2E00;
  --good:#178A5A; --good-soft:#E3F5EC; --bad:#C93B3B; --bad-soft:#FBE7E7;
  --accent:#3A6FF0; --sel-bg:#EDF2FF; --sel-ink:#111C33; --sel-border:#3A6FF0; --radio:#3A6FF0;
  --now-bg:#EDF2FF; --now-ink:#2A55C9; --prev-bg:#EBEEF4; --prev-ink:#6B7690; --btn-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111A2C; --sheet:#18233A; --ink:#E8EDF7; --muted:#9AA7C0; --line:#2A3858;
    --blue:#7C9CFF; --blue-soft:#22325A; --mark:#FFD447; --mark-ink:#3A2E00;
    --good:#4CC98D; --good-soft:#163828; --bad:#FF7B7B; --bad-soft:#3E1D22;
    --accent:#FFD447; --sel-bg:#FFD447; --sel-ink:#3A2E00; --sel-border:#FFD447; --radio:#3A2E00;
    --now-bg:#FFD447; --now-ink:#3A2E00; --prev-bg:#22304D; --prev-ink:#C5CFE3; --btn-ink:#0E1626;
  }
}
:root[data-theme="dark"]{
  --paper:#111A2C; --sheet:#18233A; --ink:#E8EDF7; --muted:#9AA7C0; --line:#2A3858;
    --blue:#7C9CFF; --blue-soft:#22325A; --mark:#FFD447; --mark-ink:#3A2E00;
    --good:#4CC98D; --good-soft:#163828; --bad:#FF7B7B; --bad-soft:#3E1D22;
    --accent:#FFD447; --sel-bg:#FFD447; --sel-ink:#3A2E00; --sel-border:#FFD447; --radio:#3A2E00;
    --now-bg:#FFD447; --now-ink:#3A2E00; --prev-bg:#22304D; --prev-ink:#C5CFE3; --btn-ink:#0E1626;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 18px 40px}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.bar .in{max-width:640px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:1.1rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .dot{width:18px;height:18px;border-radius:50%;background:var(--mark);box-shadow:inset 0 0 0 2px var(--ink)}
.bar .sp{flex:1}
.who{font-size:.85rem;color:var(--muted);max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--blue);font-weight:500;font-size:.9rem}
.link:hover{background:var(--blue-soft)}

h1{font-size:1.75rem;line-height:1.2;letter-spacing:-.02em;margin:18px 0 6px;font-weight:700}
h2{font-size:1.2rem;margin:0 0 4px;font-weight:600}
p.lead{color:var(--muted);margin:0 0 20px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-weight:600;background:var(--blue);color:#fff;min-height:50px;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* profile */
.avbtn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:3px 8px 3px 3px;border-radius:99px;min-width:0}
.avbtn:hover{background:var(--blue-soft)}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--accent)}
.av.initial,.bigav .initial{display:inline-flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);font-weight:700}
.bigav{width:150px;height:150px;margin:0 auto 12px;border-radius:50%;overflow:hidden;border:4px solid var(--accent);box-shadow:0 0 0 2px var(--line)}
.bigav img,.bigav .initial{width:100%;height:100%;object-fit:cover;display:flex;font-size:3.4rem;border:0}
.hero .lead{margin-bottom:8px}
.stack{display:grid;gap:12px}
.link.center{display:block;margin:0 auto}
.plist{padding:4px 18px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0}
.prow+.prow{border-top:1px solid var(--line)}
.prow span{color:var(--muted);font-size:.92rem}
.prow b{font-weight:600;text-align:right}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.pick label{position:relative;cursor:pointer}
.pick label:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.hint.center{text-align:center;margin-top:12px}
.link.inline{padding:2px 4px;font-size:inherit}
.live{margin-top:14px;display:grid;gap:12px}
.live video{width:100%;max-width:320px;aspect-ratio:1;object-fit:cover;border-radius:50%;margin:0 auto;display:block;transform:scaleX(-1);background:var(--line);border:4px solid var(--accent)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);z-index:50;
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:12px 18px 12px 12px;border-radius:14px;
  background:#178A5A;color:#fff;font-weight:500;font-size:.95rem;box-shadow:0 8px 24px rgba(10,60,35,.28);
  transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .3s;opacity:0;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .tick{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;color:#178A5A;display:flex;align-items:center;justify-content:center;font-weight:800}
@media (prefers-reduced-motion:reduce){.toast{transition:opacity .2s}}
/* language toggle */
#acct{display:flex;align-items:center;gap:2px;min-width:0}
#acct[hidden]{display:none}
.lang{flex:none;display:inline-flex;border:1.5px solid var(--ink);border-radius:99px;padding:2px;background:var(--sheet)}
.lang span{padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:600;color:var(--muted);line-height:1.4}
.lang span.on{background:var(--ink);color:var(--paper)}
@media (max-width:480px){.who{display:none}.bar .link{padding:6px 5px;font-size:.82rem}.brand{font-size:.95rem}.lang span{padding:3px 7px}}
/* login */
.hero{text-align:center;margin:18px 0 4px}
.hero .avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:4px solid var(--mark);box-shadow:0 0 0 2px var(--ink);display:block;margin:0 auto 12px}
.hero h1{margin:0 0 6px}
.hero+p.lead{text-align:center}
.tabs{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
label.f{display:block;font-size:.9rem;font-weight:500;margin:0 0 6px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:14px}
.inp:focus{border-color:var(--blue);outline:none}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:-4px 0 10px}
.hint{font-size:.8rem;color:var(--muted);margin-top:14px}

/* chips (favourites) */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;text-align:left;font-weight:500;position:relative}
.chip .ic{font-size:1.4rem;width:32px;text-align:center}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--mark);color:var(--mark-ink)}
.chip[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:700}
.chip:disabled{opacity:.45;cursor:not-allowed}
.counter{font-size:.9rem;color:var(--muted);margin:4px 0 20px}

/* class grid */
.classes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.cls{aspect-ratio:1;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem}
.cls small{font-size:.65rem;font-weight:400;color:var(--muted)}
.cls[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cls[aria-pressed="true"] small{color:inherit;opacity:.75}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-weight:500}

/* quiz */
.clock{display:flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;margin:14px 0 16px;background:var(--sheet)}
.clock>div{flex:1;padding:10px 14px}
.clock>div+div{border-left:1.5px solid var(--ink)}
.clock .k{font-size:.75rem;color:var(--muted)}
.clock .v{font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.clock .now{background:var(--mark);color:var(--mark-ink)}
.clock .now .k{color:var(--mark-ink);opacity:.75}
.prog{display:flex;gap:4px;margin-bottom:18px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--ink)}
.prog i.cur{background:var(--mark);box-shadow:inset 0 0 0 1px var(--ink)}
.qnum{font-size:.9rem;color:var(--muted);margin-bottom:6px}
.qtext{font-size:1.3rem;font-weight:600;line-height:1.35;margin:0 0 18px}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px 18px 22px;box-shadow:0 1px 2px rgba(17,28,51,.04)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-size:.88rem;font-weight:500}
.qhead .qnum{margin:0;font-size:.82rem;color:var(--muted)}
.qtext{font-size:1.35rem;font-weight:600;line-height:1.35;margin:0 0 20px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:16px;padding:16px 16px;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;text-align:left;min-height:60px;font-size:1.05rem;font-weight:500;
  transition:background .2s ease,border-color .2s ease,box-shadow .2s ease,transform .12s ease}
.opt:active{transform:scale(.985)}
.radio{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);position:relative;transition:border-color .2s ease,border-width .2s ease}
.radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--radio);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.opt[aria-checked="true"]{background:var(--sel-bg);color:var(--sel-ink);border:2px solid var(--sel-border);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel-border) 18%,transparent)}
.opt[aria-checked="true"] .radio{border:3px solid var(--radio)}
.opt[aria-checked="true"] .radio::after{transform:scale(1)}
.opt.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.qnav{display:flex;gap:14px;margin-top:22px}
.qnav .btn{flex:1;border-radius:14px;min-height:54px;font-size:1.02rem}
.btn{color:var(--btn-ink)}
.btn.prev{background:var(--prev-bg);color:var(--prev-ink);border:1px solid var(--line)}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.9rem}
/* theme-aware accents */
.clock{border-color:var(--line)}
.clock>div+div{border-left-color:var(--line)}
.clock .now{background:var(--now-bg);color:var(--now-ink)}
.clock .now .k{color:var(--now-ink)}
.prog i.done{background:var(--blue)}
.prog i.cur{background:var(--accent);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border:2px solid var(--sel-border)}
.hero .avatar{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--line)!important}
.brand .dot{background:var(--accent)}
.hitem .sc.hi{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-border)}
.theme{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--sheet);display:inline-flex;align-items:center;justify-content:center;font-size:1rem;padding:0}
.bar .in{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.opt.pop{animation:none}.radio::after{transition:none}}
/* result */
.score{text-align:center;padding:28px 20px}
.score .big{font-size:4.2rem;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score .big span{color:var(--muted);font-weight:400}
.score .msg{margin-top:8px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:20px}
.stats div{padding:12px 6px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:.78rem}
h3.sec{font-size:1rem;margin:28px 0 10px}
.rev{border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:14px;margin-bottom:10px}
.rev .top{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.rev .ok{color:var(--good);font-weight:600}
.rev .no{color:var(--bad);font-weight:600}
.rev .q{font-weight:600;margin-bottom:10px}
.rev ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rev li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:.92rem}
.rev li .bub{width:24px;height:24px;font-size:.72rem;border-width:1.5px}
.rev li.right{background:var(--good-soft)}
.rev li.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.rev li.wrong{background:var(--bad-soft)}
.rev li.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.rev li em{margin-left:auto;font-style:normal;font-size:.75rem;color:var(--muted);white-space:nowrap}

/* history */
.hist{display:grid;gap:10px}
.hitem{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);text-align:left;width:100%}
.hitem .sc{flex:none;width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.hitem .sc.hi{background:var(--mark);color:var(--mark-ink)}
.hitem .meta{flex:1;min-width:0}
.hitem .d{font-weight:600}
.hitem .s{font-size:.82rem;color:var(--muted)}
.hitem .chev{color:var(--muted);font-size:1.2rem}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .btn{margin-top:16px;max-width:260px}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}

@media (max-width:420px){
  .classes{grid-template-columns:repeat(5,1fr);gap:7px}
  .cls{font-size:1.15rem;border-radius:10px}
  .clock .v{font-size:1.6rem}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== logo & avatar edit ===== */
header.bar .bandin .logo{flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.avedit{position:relative;display:block;width:150px;margin:0 auto 12px;cursor:pointer}
.avedit .bigav{display:block;margin:0}
.avedit .badge{position:absolute;right:2px;bottom:6px;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--paper);box-shadow:0 3px 10px rgba(0,0,0,.2);transition:transform .15s}
.avedit:active .badge{transform:scale(.9)}
.avedit:focus-within .badge{outline:3px solid var(--blue);outline-offset:2px}
.bigav .initial svg{color:var(--blue)}
/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,30,.5);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .18s}
.modal.show{opacity:1}
.mbox{background:var(--sheet);color:var(--ink);border-radius:18px;padding:22px 20px 18px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);transform:translateY(10px) scale(.97);transition:transform .2s}
.modal.show .mbox{transform:none}
.mbox p{margin:0 0 18px;font-size:1.02rem;font-weight:500;line-height:1.45}
.btn.danger{background:var(--bad);color:#fff}
.rdel{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--bad);display:flex;align-items:center;justify-content:center}
.rdel:active{background:var(--bad-soft)}
.udel{margin-top:14px}
/* ===== back & delete ===== */
.backwrap{max-width:640px;margin:0 auto;padding:0 18px}
.backbar{display:inline-flex;align-items:center;gap:4px;margin-top:12px;padding:8px 14px 8px 8px;border:1.5px solid var(--line);border-radius:99px;background:var(--sheet);color:var(--ink);font-weight:600;font-size:.92rem}
.backbar[hidden]{display:none}
.backbar:active{transform:scale(.97)}
.backbar svg{color:var(--blue)}
.backwrap:has(.backbar:not([hidden]))+.wrap h1:first-child{margin-top:12px}
.hwrap{display:flex;align-items:stretch;gap:8px}
.hwrap .hitem{flex:1;min-width:0}
.hdel{flex:none;width:52px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--bad);display:flex;align-items:center;justify-content:center}
.hdel:active{background:var(--bad-soft)}
.btn.logout svg{margin-right:2px}
/* ===== account forms ===== */
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.inp.ro{color:var(--muted);background:var(--line);opacity:.8}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--blue)}
.note{background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:12px}
.muted{color:var(--muted);font-weight:400}
#pEdit{margin-top:12px}
/* ===== admin ===== */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);text-align:center;transition:border-color .2s,background .2s}
.role .ri{font-size:1.6rem;line-height:1.2}
.role b{font-size:.98rem}
.role small{font-size:.75rem;color:var(--muted);line-height:1.3}
.role[aria-checked="true"]{border:2px solid var(--sel-border);background:var(--sel-bg);color:var(--sel-ink)}
.role[aria-checked="true"] small{color:inherit;opacity:.8}
header.bar .bandin .logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22))}
header.bar .bandin{padding:10px 16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.8rem;color:var(--muted)}
.ulist{display:grid;gap:10px}
.ucard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ucard[hidden]{display:none}
.ucard summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.ucard summary::-webkit-details-marker{display:none}
.ucard[open] summary{border-bottom:1px solid var(--line)}
.uav{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.uav.initial{display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);font-weight:700}
.umeta{flex:1;min-width:0;display:flex;flex-direction:column}
.umeta .un{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.umeta .us{font-size:.8rem;color:var(--muted)}
.uscore{text-align:right;flex:none}
.uscore b{display:block;font-size:1.1rem}
.uscore small{font-size:.75rem;color:var(--muted)}
.ubody{padding:4px 14px 12px}
.rtitle{font-weight:600;font-size:.9rem;margin:12px 0 6px}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.rrow span{flex:1}
.rrow small{color:var(--muted)}
.rrow em{font-style:normal;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
/* ===== header v3 ===== */
:root{--band:linear-gradient(120deg,#2F5FE0 0%,#4C7BF5 55%,#6C8DFF 100%);--band-ink:#FFFFFF;--band-dot:#FFD447}
:root[data-theme="dark"]{--band:linear-gradient(120deg,#16244A 0%,#1F3366 60%,#28407A 100%);--band-ink:#FFFFFF;--band-dot:#FFD447}
header.bar{background:var(--paper);border-bottom:1px solid var(--line)}
header.bar .band{background:var(--band);color:var(--band-ink)}
header.bar .bandin{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:10px}
header.bar .bandin #brandName{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .bandin .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--band-dot);box-shadow:0 0 0 3px rgba(255,255,255,.25)}
header.bar .in{display:block;max-width:640px;margin:0 auto;padding:6px 10px}
header.bar .nav{display:flex;gap:4px;justify-content:center}
header.bar .nav button{flex:1 1 0;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:66px;padding:6px 2px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:500;min-width:0}
header.bar .nav button[hidden]{display:none}
header.bar .nav button:hover{background:var(--blue-soft)}
header.bar .nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
header.bar .nav svg{width:26px;height:26px}
header.bar .nav .ic{display:flex}
header.bar .nav .nl{font-size:.78rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
header.bar .navav{display:flex;width:28px;height:28px}
header.bar .navav .av{width:28px;height:28px;border-width:2px;font-size:.85rem}
header.bar .nav button[aria-current="page"] .av{border-color:var(--blue)}
.btn.logout{margin-top:26px;background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.logout svg{flex:none}
.toast{top:calc(env(safe-area-inset-top,0px) + 10px)}
</style>
</head>

const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle = arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const level = c => c<=4 ? "junior" : c<=7 ? "middle" : "senior";

function numOpts(ans, spread){
  const set = new Set([ans]); let guard=0;
  while(set.size<4 && guard++<50){
    const d = rnd(1,spread)*(Math.random()<.5?-1:1);
    const v = ans+d; if(v>=0) set.add(v);
  }
  let k=1; while(set.size<4) set.add(ans+spread+(k++));
  return [ans, ...[...set].filter(v=>v!==ans)].map(String);
}
const B = (en,te)=>({en,te:te??en});
function mathQ(c){
  const t = rnd(0,2);
  if(c<=2){
    if(t===0){const a=rnd(1,20),b=rnd(1,20);return [B(`What is ${a} + ${b}?`,`${a} + ${b} ఎంత?`),numOpts(a+b,5)]}
    if(t===1){const a=rnd(10,30),b=rnd(1,a);return [B(`What is ${a} − ${b}?`,`${a} − ${b} ఎంత?`),numOpts(a-b,5)]}
    const a=rnd(2,5),b=rnd(1,10);return [B(`What is ${a} × ${b}?`,`${a} × ${b} ఎంత?`),numOpts(a*b,6)];
  }
  if(c<=4){
    if(t===0){const a=rnd(20,99),b=rnd(10,99);return [B(`What is ${a} + ${b}?`,`${a} + ${b} ఎంత?`),numOpts(a+b,10)]}
    if(t===1){const a=rnd(2,12),b=rnd(2,12);return [B(`What is ${a} × ${b}?`,`${a} × ${b} ఎంత?`),numOpts(a*b,8)]}
    const b=rnd(2,10),q=rnd(2,10);return [B(`What is ${b*q} ÷ ${b}?`,`${b*q} ÷ ${b} ఎంత?`),numOpts(q,4)];
  }
  if(c<=7){
    if(t===0){const p=[10,20,25,50][rnd(0,3)],n=rnd(2,20)*20;return [B(`What is ${p}% of ${n}?`,`${n} లో ${p}% ఎంత?`),numOpts(n*p/100,10)]}
    if(t===1){const a=rnd(12,45),b=rnd(11,25);return [B(`What is ${a} × ${b}?`,`${a} × ${b} ఎంత?`),numOpts(a*b,30)]}
    const l=rnd(3,15),w=rnd(2,12);return [B(`A rectangle is ${l} cm long and ${w} cm wide. What is its area in cm²?`,`ఒక దీర్ఘచతురస్రం పొడవు ${l} సెం.మీ., వెడల్పు ${w} సెం.మీ. దాని వైశాల్యం ఎన్ని చ.సెం.మీ.?`),numOpts(l*w,8)];
  }
  if(t===0){const n=rnd(11,25);return [B(`What is ${n}²?`,`${n}² ఎంత?`),numOpts(n*n,25)]}
  if(t===1){const x=rnd(2,15),a=rnd(2,9),b=rnd(1,20);return [B(`Solve for x: ${a}x + ${b} = ${a*x+b}`,`x విలువ కనుగొనండి: ${a}x + ${b} = ${a*x+b}`),numOpts(x,4)]}
  const n=[144,169,196,225,256,289,324,361,400,441,484,529,576,625][rnd(0,13)];return [B(`What is √${n}?`,`√${n} ఎంత?`),numOpts(Math.sqrt(n),4)];
}

function buildQuiz(subjects, cls){
  const lv = level(cls), per = subjects.length===1 ? [10] : [5,5];
  let qs=[];
  subjects.forEach((s,i)=>{
    let pool;
    if(s==="maths"){
      const seen=new Set();pool=[];let g=0;
      while(pool.length<per[i]&&g++<100){const [q,o]=mathQ(cls);if(!seen.has(q.en)){seen.add(q.en);pool.push([q,o.map(x=>B(x))])}}
    } else {
      pool = shuffle(BANK[s][lv].map((item,k)=>{
        const te = BANK_TE[s][lv][k];
        return [B(item[0],te[0]), item[1].map((o,j)=>B(o, te[1]?te[1][j]:o)), {s,lv,k}];
      })).slice(0,per[i]);
    }
    pool.forEach(([q,opts,ref])=>{const o=shuffle(opts);qs.push({q,opts:o,ans:o.indexOf(opts[0]),pick:null,t:0,sub:s,ref,perm:o.map(x=>opts.indexOf(x))})});
  });
  return shuffle(qs);
}

function packQ(q){
  return q.ref ? {r:[q.ref.s,q.ref.lv,q.ref.k],p:q.perm,a:q.ans,c:q.pick,t:q.t,s:q.sub}
               : {q:q.q,o:q.opts.map(x=>typeof x==="string"?x:x.en),a:q.ans,c:q.pick,t:q.t,s:q.sub};
}
function unpackQ(x){
  try{
    if(x.r){const [s,lv,k]=x.r, e=BANK[s][lv][k], te=BANK_TE[s][lv][k];
      const all=e[1].map((o,j)=>B(o,te[1]?te[1][j]:o));
      return {q:B(e[0],te[0]),opts:x.p.map(i=>all[i]),ans:x.a,pick:x.c,t:x.t,sub:x.s};}
    if(x.o) return {q:x.q,opts:x.o,ans:x.a,pick:x.c,t:x.t,sub:x.s};
  }catch(e){}
  return x;
}

    else if(route.name==="profile") { updateBar(); vProfile(); }
    else updateBar();
    try{ delUnsub=db.doc("control/deletions").onSnapshot(ds=>{ if(ds.exists){ const d=ds.data()||{}; DEL={attempts:d.attempts||[],users:d.users||[]}; applyDeletions(); } },()=>{}); }catch(e){}
    scheduleSummary();
  }catch(e){ dbRef=null; finishSync(); }
}

async function hash(pw, salt){
  const txt = salt+":"+pw;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){let h=0;for(const ch of txt){h=(h*31+ch.charCodeAt(0))|0}return "x"+h}
}

let route={name:"loading"}, tick=null;

function isRoot(n){ return n==="login" || (n==="fav" && !isAdmin()) || (n==="admin" && isAdmin()); }
function go(name, data={}, opt={}){
  if(tick){clearInterval(tick);tick=null}
  stopLive();
  if(!opt.back && route && route.name!=="loading" && (route.name!==name || name==="forgot")) navStack.push(route);
  route={name,...data};
  if(isRoot(name) || !me() && name==="login") navStack=[];
  render(); window.scrollTo(0,0);
}
async function goBack(){
  if(route.name==="quiz" && !(await ask(t("leave"),{ok:t("leaveOk")}))) return;
  while(navStack.length){
    const r=navStack.pop();
    if(r.name==="quiz") continue;
    if(me() && (r.name==="login"||r.name==="forgot")) continue;
    if(!me() && !["login","forgot"].includes(r.name)) continue;
    const {name:rn,...rest}=r;
    return go(rn,rest,{back:true});
  }
  go(me()?homeRoute():"login",{}, {back:true});
}

}

function readPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const n=Math.min(img.naturalWidth,img.naturalHeight), sz=240, c=document.createElement("canvas");
      c.width=c.height=sz;
      c.getContext("2d").drawImage(img,(img.naturalWidth-n)/2,(img.naturalHeight-n)/2,n,n,0,0,sz,sz);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.8));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};
    img.src=url;
  });
}

/* ---------------- Admin deletions ---------------- */
let DEL={attempts:[],users:[]}, delRef=null, delUnsub=null;
const userDeleted=(dev,un,created)=>DEL.users.some(x=>x.d===dev&&x.u===un&&(x.ts||0)>(created||0));
const attDeleted=(dev,un,id)=>DEL.attempts.some(x=>x.d===dev&&x.u===un&&x.a===id);
function applyDeletions(){
  if(!myId) return;
  let changed=false, phChanged=false;
  for(const un of Object.keys(S.accounts)){
    const a=S.accounts[un];
    if(userDeleted(myId,un,a.created)){
      delete S.accounts[un]; changed=true;
      if(PH[un]){ delete PH[un]; phChanged=true; }
      if(S.session===un){ S.session=null; }
      continue;
    }
    const before=(a.history||[]).length;
    a.history=(a.history||[]).filter(x=>!attDeleted(myId,un,x.id));
    if(a.history.length!==before) changed=true;
  }
  if(changed){ save(); if(phChanged) savePhotos(); if(route.name!=="quiz") render(); }
}
async function adminDelete(kind, dev, un, id){
  const msg = kind==="user" ? t("delUserAsk") : t("delAsk");
  if(!(await ask(msg,{danger:true, ok:kind==="user"?t("delUserOk"):t("delOk")}))) return;
  const local = dev==="local" || dev===myId;
  if(local){
    const a=S.accounts[un];
    if(a){
      if(kind==="user"){ delete S.accounts[un]; if(PH[un]){ delete PH[un]; savePhotos(); } }
      else a.history=(a.history||[]).filter(x=>x.id!==id);
      save();
    }
  }
  if(!local || (myId && dbCap)){
    try{
      const ref=dbCap.doc("control/deletions"), snap=await ref.get();
      const cur=snap.exists?(snap.data()||{}):{};
      const next={attempts:Array.isArray(cur.attempts)?cur.attempts.slice():[], users:Array.isArray(cur.users)?cur.users.slice():[]};
      if(kind==="user") next.users.push({d:dev,u:un,ts:Date.now()});
      else next.attempts.push({d:dev,u:un,a:id});
      next.attempts=next.attempts.slice(-2000); next.users=next.users.slice(-500);
      await ref.set(next); DEL=next;
    }catch(e){ if(!local){ toast(t("delFail")); return; } }
  }
  toast(kind==="user"?t("okUserDeleted"):t("okDeleted"));
  vAdmin();
}

/* ---------------- In-app confirm dialog ---------------- */
function ask(msg, o={}){
  return new Promise(res=>{
    const prev=document.activeElement;
    const w=document.createElement("div");
    w.className="modal";
    w.innerHTML=`<div class="mbox" role="alertdialog" aria-modal="true" aria-labelledby="mmsg">
        <p id="mmsg">${esc(msg)}</p>
        <div class="row"><button class="btn ghost" data-r="0">${t("cancel")}</button><button class="btn ${o.danger?"danger":""}" data-r="1">${esc(o.ok||t("okBtn"))}</button></div>
      </div>`;
    const done=v=>{ w.classList.remove("show"); setTimeout(()=>w.remove(),180); document.removeEventListener("keydown",key); try{prev&&prev.focus()}catch(e){} res(v); };
    const key=e=>{ if(e.key==="Escape") done(false); };
    w.addEventListener("click",e=>{ if(e.target===w) done(false); const b=e.target.closest("[data-r]"); if(b) done(b.dataset.r==="1"); });
    document.addEventListener("keydown",key);
    document.body.appendChild(w);
    requestAnimationFrame(()=>w.classList.add("show"));
    w.querySelector('[data-r="1"]').focus();
  });
}

/* ---------------- Account helpers ---------------- */
const digits = v=>String(v||"").replace(/\D/g,"");
const phoneKey = v=>{const d=digits(v); return d.length>10 ? d.slice(-10) : d;};
const validEmail = v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const validPhone = v=>{const d=digits(v); return d.length>=10 && d.length<=13;};
function findAccounts(id){
  id=String(id||"").trim().toLowerCase();
  if(!id) return [];
  if(S.accounts[id]) return [id];
  const pk=phoneKey(id);
  if(pk.length===10 && /^[+\d\s()-]+$/.test(id)) return Object.keys(S.accounts).filter(u=>phoneKey(S.accounts[u].phone)===pk);
  return [];
}
const maskEmail = e=>{ if(!e) return ""; const [a,d]=e.split("@"); return a.charAt(0)+"•".repeat(Math.max(2,a.length-1))+"@"+d; };
const maskPhone = p=>{ const d=digits(p); return d ? "•".repeat(Math.max(0,d.length-4))+d.slice(-4) : ""; };
const field = (id,label,attrs="",val="")=>`<label class="f" for="${id}">${label}</label><input class="inp" id="${id}" ${attrs} value="${esc(val)}">`;

      let ok=null;

      if(!ok) return err("errWrongPw");
      S.session=ok; save(); go(PH[ok]?homeRoute():"photo"); toast(t("okLogin")(S.accounts[ok].name));
    }
  };
}

let fpTries=0;
function vForgot(){
  const step=route.step||1, a=route.un?S.accounts[route.un]:null;
  if(step>1 && !a){ route={name:"forgot",step:1}; return vForgot(); }
  const body = step===1 ? `
      <p class="lead">${t("fpLead1")}</p>
      ${field("fid",t("idLabel"),`autocomplete="username" autocapitalize="none" placeholder="${t("idPh")}"`)}
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">${t("nextBtn")}</button>`
    : step===2 ? `
      <p class="lead">${t("fpLead2")}</p>
      ${a.email?field("fem",t("emailLbl"),`type="email" autocapitalize="none" placeholder="${t("savedHint")(maskEmail(a.email))}"`):""}
      ${a.phone?field("fph",t("phoneLbl"),`type="tel" inputmode="tel" placeholder="${t("savedHint")(maskPhone(a.phone))}"`):""}
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">${t("verify")}</button>`
    : `
      <p class="lead">${t("fpLead3")}</p>
      ${field("np1",t("newPw"),`type="password" autocomplete="new-password" placeholder="${t("pwPh")}"`)}
      ${field("np2",t("confirmPw"),`type="password" autocomplete="new-password"`)}
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">${t("updatePw")}</button>`;
  $app.innerHTML=`
    <h1>${t("fpTitle")}</h1>
    <div class="steps" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=step?"on":""}"></i>`).join("")}</div>
    <form class="sheet" id="ff" novalidate>${body}</form>`;
  const err=k=>document.getElementById("err").textContent=t(k);
  const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  document.getElementById("ff").onsubmit=async e=>{
    e.preventDefault();
    if(step===1){
      if(!syncDone) await syncReady;
      const m=findAccounts(val("fid"));
      if(!m.length) return err("errNoAccId");
      if(m.length>1) return err("errMulti");
      const acc=S.accounts[m[0]];
      if(!acc.email && !acc.phone) return err("errNoRec");
      go("forgot",{step:2,un:m[0]});
    } else if(step===2){
      if(fpTries>=5) return err("errTooMany");
      const okE=!a.email || val("fem").toLowerCase()===a.email.toLowerCase();
      const okP=!a.phone || (phoneKey(val("fph")) && phoneKey(val("fph"))===phoneKey(a.phone));
      if(!(okE&&okP)){ fpTries++; return err(fpTries>=5?"errTooMany":"errVerify"); }
      fpTries=0; go("forgot",{step:3,un:route.un,ok:true});
    } else {
      if(!route.ok) return go("forgot",{step:1});
      const p1=document.getElementById("np1").value, p2=document.getElementById("np2").value;
      if(p1.length<4) return err("errPw");
      if(p1!==p2) return err("errMatch");
      a.salt=Math.random().toString(36).slice(2,10); a.pass=await hash(p1,a.salt); save();
      go("login"); toast(t("okPwReset"));
    }
  };
}

function vQuiz(){

  $app.innerHTML=`

    </div>

    <div class="qcard">
      <div class="qhead"><span class="pill">${subName(Q.sub)}</span><span class="qnum">${t("qOf")(Z.i+1,Z.qs.length)}</span></div>

        ${Q.opts.map((o,k)=>`<button class="opt" role="radio" aria-checked="${Q.pick===k}" data-k="${k}"><span class="radio"></span><span class="otext">${LETTERS[k]}. ${esc(L(o))}</span></button>`).join("")}
      </div>
    </div>
    <div class="qnav">
      <button class="btn prev" id="pv" ${Z.i===0?"disabled":""}><span aria-hidden="true">←</span> ${t("prevQ")}</button>
      <button class="btn" id="nx" ${Q.pick===null?"disabled":""}>${last?t("finish"):t("nextQ")} <span aria-hidden="true">${last?"✓":"→"}</span></button>
    </div>`;
  const tq=document.getElementById("tq"), tt=document.getElementById("tt");
  const upd=()=>{const n=Date.now();tq.textContent=fmt(Q.t+(n-Z.qStart));tt.textContent=fmt(n-Z.start)};
  upd(); tick=setInterval(upd,250);
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    Q.pick=+b.dataset.k;
    $app.querySelectorAll(".opt").forEach(x=>{x.setAttribute("aria-checked",x===b);x.classList.remove("pop")});
    void b.offsetWidth; b.classList.add("pop");
    document.getElementById("nx").disabled=false;
  });
  const leave=dir=>{
    const now=Date.now(); Q.t+=now-Z.qStart; Z.i+=dir; Z.qStart=now;
    clearInterval(tick); tick=null; vQuiz(); window.scrollTo(0,0);
  };
  document.getElementById("pv").onclick=()=>{ if(Z.i>0) leave(-1) };
  document.getElementById("nx").onclick=()=>{
    if(!last) return leave(1);
    const now=Date.now(); Q.t+=now-Z.qStart;

    const u=me(); u.history=[att,...(u.history||[])].slice(0,50); save();
    go("result",{att,fresh:true}); toast(t("okSaved"));
  };
}

function reviewHTML(att){

      <div class="q">${esc(L(q.q))}</div>
      <ul>${q.opts.map((o,k)=>{
        const cls=k===q.ans?"right":(k===q.pick?"wrong":"");
        const note=k===q.pick?t("yourAns"):k===q.ans?t("correctAns"):"";
        return `<li class="${cls}"><span class="bub">${LETTERS[k]}</span>${esc(L(o))}${note?`<em>${note}</em>`:""}</li>`}).join("")}</ul>
    </div>`}).join("");
}
function scoreHTML(att){
  const pct=att.correct/att.total;

  return `<div class="sheet score">
      <div class="big">${att.correct}<span>/${att.total}</span></div>
      <div class="msg">${msg}</div>
      <div class="stats">
        <div><b>${fmt(att.time)}</b><small>${t("totalTime")}</small></div>
        <div><b>${fmtShort(att.time/att.total)}</b><small>${t("perQ")}</small></div>

}
