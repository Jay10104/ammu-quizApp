input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 18px 40px}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.bar .in{max-width:640px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:1.1rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .dot{width:18px;height:18px;border-radius:50%;background:var(--mark);box-shadow:inset 0 0 0 2px var(--ink)}
.bar .sp{flex:1}
.who{font-size:.85rem;color:var(--muted);max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--blue);font-weight:500;font-size:.9rem}
.link:hover{background:var(--blue-soft)}

h1{font-size:1.75rem;line-height:1.2;letter-spacing:-.02em;margin:18px 0 6px;font-weight:700}
h2{font-size:1.2rem;margin:0 0 4px;font-weight:600}
p.lead{color:var(--muted);margin:0 0 20px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-weight:600;background:var(--blue);color:var(--btn-ink,#fff);min-height:50px;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* profile */
.avbtn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:3px 8px 3px 3px;border-radius:99px;min-width:0}
.avbtn:hover{background:var(--blue-soft)}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--accent)}
.av.initial,.bigav .initial{display:inline-flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);font-weight:700}
.bigav{width:150px;height:150px;margin:0 auto 12px;border-radius:50%;overflow:hidden;border:4px solid var(--accent);box-shadow:0 0 0 2px var(--line)}
.bigav img,.bigav .initial{width:100%;height:100%;object-fit:cover;display:flex;font-size:3.4rem;border:0}
/* The large profile photo uses the same avatar source as the top-right account icon. */
.bigav .profile-avatar{width:100%;height:100%;object-fit:cover;display:block;border:0}
.hero .lead{margin-bottom:8px}
.stack{display:grid;gap:12px}
.link.center{display:block;margin:0 auto}
.plist{padding:4px 18px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0}
.prow+.prow{border-top:1px solid var(--line)}
.prow span{color:var(--muted);font-size:.92rem}
.prow b{font-weight:600;text-align:right}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.pick label{position:relative;cursor:pointer}
.pick label:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.hint.center{text-align:center;margin-top:12px}
.link.inline{padding:2px 4px;font-size:inherit}
.live{margin-top:14px;display:grid;gap:12px}
.live video{width:100%;max-width:320px;aspect-ratio:1;object-fit:cover;border-radius:50%;margin:0 auto;display:block;transform:scaleX(-1);background:var(--line);border:4px solid var(--accent)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);z-index:50;
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:12px 18px 12px 12px;border-radius:14px;
  background:#178A5A;color:#fff;font-weight:500;font-size:.95rem;box-shadow:0 8px 24px rgba(10,60,35,.28);
  transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .3s;opacity:0;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .tick{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;color:#178A5A;display:flex;align-items:center;justify-content:center;font-weight:800}
@media (prefers-reduced-motion:reduce){.toast{transition:opacity .2s}}
/* language toggle */
#acct{display:flex;align-items:center;gap:2px;min-width:0}
#acct[hidden]{display:none}
.lang{flex:none;display:inline-flex;border:1.5px solid var(--ink);border-radius:99px;padding:2px;background:var(--sheet)}
.lang span{padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:600;color:var(--muted);line-height:1.4}
.lang span.on{background:var(--ink);color:var(--paper)}
@media (max-width:480px){.who{display:none}.bar .link{padding:6px 5px;font-size:.82rem}.brand{font-size:.95rem}.lang span{padding:3px 7px}}
/* login */
.login-tagline{position:relative;overflow:hidden;text-align:center;margin:18px 0 22px;padding:22px 16px;border-radius:18px;background:linear-gradient(135deg,#243d79 0%,#536fe0 55%,#8aa4ff 100%);color:#fff;box-shadow:0 10px 24px rgba(55,82,170,.24);border:1px solid rgba(255,255,255,.22)}
.login-tagline:before,.login-tagline:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.login-tagline:before{width:130px;height:130px;right:-35px;top:-65px}.login-tagline:after{width:90px;height:90px;left:-28px;bottom:-48px}
.login-tagline .lead{position:relative;z-index:1;color:#fff!important;font-size:1.45rem;font-weight:800;letter-spacing:.02em;margin:0 0 5px!important}
.tagline-mark{display:block;position:relative;z-index:1;font-size:1.15rem;margin-bottom:3px;color:#ffdf79}
.tagline-sub{position:relative;z-index:1;font-size:.9rem;color:rgba(255,255,255,.9);font-weight:500}
.tabs{display:flex;background:var(--blue-soft);border:1px solid var(--line);border-radius:14px;padding:5px;gap:6px;margin-bottom:18px}
.tabs button{flex:1;min-width:0;border:1px solid var(--line);background:var(--sheet);padding:12px 8px;border-radius:10px;font-weight:700;color:var(--ink);transition:background .18s,box-shadow .18s,color .18s}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,#5278f5,#83a0ff);color:#101b3b;border-color:rgba(255,255,255,.65);box-shadow:0 4px 12px rgba(70,105,220,.3)}
.hero{text-align:center;margin:18px 0 4px}
.hero .avatar{width:min(260px,72vw);height:auto;aspect-ratio:1;border-radius:28px;object-fit:cover;background:#fff;border:4px solid var(--mark);box-shadow:0 0 0 2px var(--ink);display:block;margin:0 auto 12px}
.hero h1{margin:0 0 6px}
.hero+p.lead{text-align:center}
.tabs{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
label.f{display:block;font-size:.9rem;font-weight:500;margin:0 0 6px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:14px}
.inp:focus{border-color:var(--blue);outline:none}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:-4px 0 10px}
.username-inline-error{display:none;color:var(--bad);font-size:.82rem;line-height:1.3;margin:-9px 0 10px;padding-left:2px;}
.username-inline-error.visible{display:block;}
#un[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)!important;}
.hint{font-size:.8rem;color:var(--muted);margin-top:14px}

/* login/create-account landing */
.auth-welcome{max-width:560px;min-height:calc(100dvh - 48px);margin:0 auto;padding:18px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center}
.auth-icon-wrap{width:104px;height:104px;border-radius:50%;padding:4px;margin:0 auto 12px;background:linear-gradient(135deg,var(--accent),var(--blue));box-shadow:0 5px 18px rgba(30,60,120,.2)}
.auth-icon-wrap.small{width:76px;height:76px}
.auth-icon-wrap.auth-page-icon{width:92px;height:92px}
.auth-icon{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;border:3px solid var(--paper);background:var(--sheet)}
.auth-title{margin:0 0 12px;text-align:center}
.auth-welcome .landing-square{width:min(230px,60vw);aspect-ratio:1;border-radius:28px;object-fit:cover;display:block;margin:0 auto 12px;border:4px solid var(--mark);background:var(--sheet);box-shadow:0 8px 24px rgba(75,73,170,.18)}
.auth-welcome .auth-title{font-size:clamp(1.65rem,6vw,2.25rem);margin:0 0 2px}
.auth-welcome .landing-subtitle{color:var(--accent);font-size:1.1rem;font-weight:700;margin:0 0 16px}
.login-tagline{width:min(100%,490px);margin:10px auto 18px;padding:14px 18px;border-radius:20px;background:linear-gradient(115deg,#eee8ff,#e4f4ff 55%,#fff0f5);color:var(--ink);box-shadow:0 4px 14px rgba(55,82,170,.1);border:2px solid #c8caff;display:flex;align-items:center;justify-content:center;min-height:78px}
.login-tagline .lead{color:var(--ink)!important;font-size:clamp(1.05rem,4.3vw,1.45rem);font-weight:800;letter-spacing:.01em;margin:0!important}
.login-tagline.compact{max-width:290px;margin:8px auto 16px;padding:8px 12px}
.auth-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px auto 0;width:100%;max-width:490px}
.auth-action{width:100%;min-width:0;min-height:56px;padding:12px 8px;border-radius:16px;font-weight:750;box-shadow:0 5px 14px rgba(30,60,120,.15);font-size:clamp(.88rem,3.4vw,1rem)}
.auth-action.primary{background:linear-gradient(135deg,#36b2ff,#0878f9);color:#fff;border:1px solid transparent}
.auth-action.secondary{background:linear-gradient(135deg,#b45cf1,#6540ec);color:#fff;border:1px solid transparent}
.auth-home-back{margin-top:auto;min-width:150px;padding:11px 24px;border-radius:30px;background:linear-gradient(135deg,#e8e4ff,#d9dfff);border:1px solid #d4d0ff;color:#4b2cb6;font-weight:750;box-shadow:none}
.auth-form-head{position:relative;text-align:center;margin:18px 0 4px}
.auth-back{display:block;margin:4px auto 10px}
@media(max-width:380px){.auth-welcome{padding-top:10px}.auth-welcome .landing-square{width:min(190px,54vw);border-radius:22px}.login-tagline{min-height:66px;padding:10px}.auth-actions{gap:8px}.auth-action{min-height:52px;padding:10px 5px}}

/* chips (favourites) */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;text-align:left;font-weight:500;position:relative}
.chip .ic{font-size:1.4rem;width:32px;text-align:center}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--mark);color:var(--mark-ink)}
.chip[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:700}
.chip:disabled{opacity:.45;cursor:not-allowed}
.counter{font-size:.9rem;color:var(--muted);margin:4px 0 20px}

/* class grid */
.classes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.cls{aspect-ratio:1;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem}
.cls small{font-size:.65rem;font-weight:400;color:var(--muted)}
.cls[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cls[aria-pressed="true"] small{color:inherit;opacity:.75}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-weight:500}

/* quiz */
.clock{display:flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;margin:14px 0 16px;background:var(--sheet)}
.clock>div{flex:1;padding:10px 14px}
.clock>div+div{border-left:1.5px solid var(--ink)}
.clock .k{font-size:.75rem;color:var(--muted)}
.clock .v{font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.clock .now{background:var(--mark);color:var(--mark-ink)}
.clock .now .k{color:var(--mark-ink);opacity:.75}
.prog{display:flex;gap:4px;margin-bottom:18px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--ink)}
.prog i.cur{background:var(--mark);box-shadow:inset 0 0 0 1px var(--ink)}
.qnum{font-size:.9rem;color:var(--muted);margin-bottom:6px}
.qtext{font-size:1.3rem;font-weight:600;line-height:1.35;margin:0 0 18px}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px 18px 22px;box-shadow:0 1px 2px rgba(17,28,51,.04)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-size:.88rem;font-weight:500}
.qhead .qnum{margin:0;font-size:.82rem;color:var(--muted)}
.qtext{font-size:1.35rem;font-weight:600;line-height:1.35;margin:0 0 20px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:16px;padding:16px 16px;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;text-align:left;min-height:60px;font-size:1.05rem;font-weight:500;
  transition:background .2s ease,border-color .2s ease,box-shadow .2s ease,transform .12s ease}
.opt:active{transform:scale(.985)}
.radio{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);position:relative;transition:border-color .2s ease,border-width .2s ease}
.radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--radio);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.opt[aria-checked="true"]{background:var(--sel-bg);color:var(--sel-ink);border:2px solid var(--sel-border);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel-border) 18%,transparent)}
.opt[aria-checked="true"] .radio{border:3px solid var(--radio)}
.opt[aria-checked="true"] .radio::after{transform:scale(1)}
.opt.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.qnav{display:flex;gap:14px;margin-top:22px}
.qnav .btn{flex:1;border-radius:14px;min-height:54px;font-size:1.02rem}
.btn{color:var(--btn-ink)}
.btn.prev{background:var(--prev-bg);color:var(--prev-ink);border:1px solid var(--line)}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.9rem}
/* theme-aware accents */
.clock{border-color:var(--line)}
.clock>div+div{border-left-color:var(--line)}
.clock .now{background:var(--now-bg);color:var(--now-ink)}
.clock .now .k{color:var(--now-ink)}
.prog i.done{background:var(--blue)}
.prog i.cur{background:var(--accent);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border:2px solid var(--sel-border)}
.hero .avatar{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--line)!important}
.brand .dot{background:var(--accent)}
.hitem .sc.hi{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-border)}
.theme{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--sheet);display:inline-flex;align-items:center;justify-content:center;font-size:1rem;padding:0}
.bar .in{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.opt.pop{animation:none}.radio::after{transition:none}}
/* result */
.score{text-align:center;padding:28px 20px}
.score .big{font-size:4.2rem;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score .big span{color:var(--muted);font-weight:400}
.score .msg{margin-top:8px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:20px}
.stats div{padding:12px 6px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:.78rem}
h3.sec{font-size:1rem;margin:28px 0 10px}
.rev{border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:14px;margin-bottom:10px}
.rev .top{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.rev .ok{color:var(--good);font-weight:600}
.rev .no{color:var(--bad);font-weight:600}
.rev .q{font-weight:600;margin-bottom:10px}
.rev ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rev li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:.92rem}
.rev li .bub{width:24px;height:24px;font-size:.72rem;border-width:1.5px}
.rev li.right{background:var(--good-soft)}
.rev li.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.rev li.wrong{background:var(--bad-soft)}
.rev li.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.rev li em{margin-left:auto;font-style:normal;font-size:.75rem;color:var(--muted);white-space:nowrap}

/* history */
.hist{display:grid;gap:10px}
.hitem{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);text-align:left;width:100%}
.hitem .sc{flex:none;width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.hitem .sc.hi{background:var(--mark);color:var(--mark-ink)}
.hitem .meta{flex:1;min-width:0}
.hitem .d{font-weight:600}
.hitem .s{font-size:.82rem;color:var(--muted)}
.hitem .chev{color:var(--muted);font-size:1.2rem}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .btn{margin-top:16px;max-width:260px}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}

@media (max-width:420px){
  .classes{grid-template-columns:repeat(5,1fr);gap:7px}
  .cls{font-size:1.15rem;border-radius:10px}
  .clock .v{font-size:1.6rem}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== logo & avatar edit ===== */
header.bar .bandin .logo{flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.avedit{position:relative;display:block;width:150px;margin:0 auto 12px;cursor:pointer}
.avedit .bigav{display:block;margin:0}
.avedit .badge{position:absolute;right:2px;bottom:6px;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--paper);box-shadow:0 3px 10px rgba(0,0,0,.2);transition:transform .15s}
.avedit:active .badge{transform:scale(.9)}
.avedit:focus-within .badge{outline:3px solid var(--blue);outline-offset:2px}
.bigav .initial svg{color:var(--blue)}
/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,30,.5);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .18s}
.modal.show{opacity:1}
.mbox{background:var(--sheet);color:var(--ink);border-radius:18px;padding:22px 20px 18px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);transform:translateY(10px) scale(.97);transition:transform .2s}
.modal.show .mbox{transform:none}
.mbox p{margin:0 0 18px;font-size:1.02rem;font-weight:500;line-height:1.45}
.btn.danger{background:var(--bad);color:#fff}
.rdel{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--bad);display:flex;align-items:center;justify-content:center}
.rdel:active{background:var(--bad-soft)}
.udel{margin-top:14px}
/* ===== levels & profile type ===== */
.roles.three{grid-template-columns:repeat(3,1fr)}
.roles.three .role{padding:12px 4px}
.roles.three .role small{font-size:.68rem}
#catBlock[hidden]{display:none}
.gav{width:42px;height:42px;border-radius:50%;margin-bottom:4px}
.levels{display:grid;gap:10px;margin-bottom:16px}
.lvl{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--sheet);text-align:left;position:relative}
.lvl .li{font-size:1.7rem;flex:none}
.lvl .lt{display:flex;flex-direction:column;flex:1}
.lvl .lt small{color:var(--muted);font-size:.82rem}
.lvl .sug{position:absolute;top:-9px;right:12px;background:var(--good);color:#fff;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:99px}
.lvl[aria-checked="true"]{border:2px solid var(--sel-border);background:var(--sel-bg);color:var(--sel-ink)}
.lvl[aria-checked="true"] .lt small{color:inherit;opacity:.8}
/* ===== address ===== */
.pinrow{display:flex;gap:8px}
.pinrow .inp{flex:1;margin-bottom:6px}
.pinrow .btn{width:auto;min-height:0;height:50px;padding:0 18px;flex:none}
.astatus{font-size:.84rem;min-height:1.2em;margin:0 0 10px;color:var(--muted)}
.astatus.ok{color:var(--good)}
.astatus.bad{color:var(--bad)}
/* ===== back & delete ===== */
.backwrap{max-width:640px;margin:0 auto;padding:0 18px}
.backbar{display:inline-flex;align-items:center;gap:4px;margin-top:12px;padding:8px 14px 8px 8px;border:1.5px solid var(--line);border-radius:99px;background:var(--sheet);color:var(--ink);font-weight:600;font-size:.92rem}
.backbar[hidden]{display:none}
.backbar:active{transform:scale(.97)}
.backbar svg{color:var(--blue)}
.backwrap:has(.backbar:not([hidden]))+.wrap h1:first-child{margin-top:12px}
.hwrap{display:flex;align-items:stretch;gap:8px}
.hwrap .hitem{flex:1;min-width:0}
.hdel{flex:none;width:52px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--bad);display:flex;align-items:center;justify-content:center}
.hdel:active{background:var(--bad-soft)}
.btn.logout svg{margin-right:2px}
/* ===== account forms ===== */
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.inp.ro{color:var(--muted);background:var(--line);opacity:.8}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--blue)}
.note{background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:12px}
.muted{color:var(--muted);font-weight:400}
#pEdit{margin-top:12px}
/* ===== admin ===== */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);text-align:center;transition:border-color .2s,background .2s}
.role .ri{font-size:1.6rem;line-height:1.2}
.role b{font-size:.98rem}
.role small{font-size:.75rem;color:var(--muted);line-height:1.3}
.role[aria-checked="true"]{border:2px solid var(--sel-border);background:var(--sel-bg);color:var(--sel-ink)}
.role[aria-checked="true"] small{color:inherit;opacity:.8}
header.bar .bandin .logo{width:46px;height:46px;flex:none;border-radius:14px;object-fit:cover;background:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.22)}
header.bar .bandin{padding:10px 16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.8rem;color:var(--muted)}
.ulist{display:grid;gap:10px}
.ucard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ucard[hidden]{display:none}
.ucard summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.ucard summary::-webkit-details-marker{display:none}
.ucard[open] summary{border-bottom:1px solid var(--line)}
.uav{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.uav.initial{display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);font-weight:700}
.umeta{flex:1;min-width:0;display:flex;flex-direction:column}
.umeta .un{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.umeta .us{font-size:.8rem;color:var(--muted)}
.uscore{text-align:right;flex:none}
.uscore b{display:block;font-size:1.1rem}
.uscore small{font-size:.75rem;color:var(--muted)}
.ubody{padding:4px 14px 12px}
.rtitle{font-weight:600;font-size:.9rem;margin:12px 0 6px}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.rrow span{flex:1}
.rrow small{color:var(--muted)}
.rrow em{font-style:normal;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
/* ===== header v3 ===== */
:root{--band:linear-gradient(120deg,#2F5FE0 0%,#4C7BF5 55%,#6C8DFF 100%);--band-ink:#FFFFFF;--band-dot:#FFD447}
:root[data-theme="dark"]{--band:linear-gradient(120deg,#16244A 0%,#1F3366 60%,#28407A 100%);--band-ink:#FFFFFF;--band-dot:#FFD447}
header.bar{background:var(--paper);border-bottom:1px solid var(--line)}
header.bar .band{background:var(--band);color:var(--band-ink)}
header.bar .bandin{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:10px}
header.bar .bandin #brandName{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .bandin .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--band-dot);box-shadow:0 0 0 3px rgba(255,255,255,.25)}
header.bar .in{display:block;max-width:640px;margin:0 auto;padding:6px 10px}
header.bar .nav{display:flex;gap:4px;justify-content:center}
header.bar .nav button{flex:1 1 0;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:66px;padding:6px 2px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:500;min-width:0}
header.bar .nav button[hidden]{display:none}
header.bar .nav button:hover{background:var(--blue-soft)}
header.bar .nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
header.bar .nav svg{width:26px;height:26px}
header.bar .nav .ic{display:flex}
header.bar .nav .nl{font-size:.78rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
header.bar .navav{display:flex;width:28px;height:28px}
header.bar .navav .av{width:28px;height:28px;border-width:2px;font-size:.85rem}
header.bar .nav button[aria-current="page"] .av{border-color:var(--blue)}
.btn.logout{margin-top:26px;background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.logout svg{flex:none}
.toast{top:calc(env(safe-area-inset-top,0px) + 10px)}
/* ===== compact quiz & bottom back ===== */
header.bar .bandin .logo{width:52px;height:52px;border-radius:14px;object-fit:contain;background:#fff}
header.bar .bandin{padding:8px 16px}
.backwrap{padding:0 18px 28px}
.backbar{margin-top:4px}
.wrap{padding-bottom:16px}
.clock{margin:8px 0 10px;border-radius:12px}
.clock>div{padding:6px 12px}
.clock .k{font-size:.7rem}
.clock .v{font-size:1.35rem}
.prog{margin-bottom:10px}
.prog i{height:5px}
.qcard{padding:14px 14px 16px;border-radius:16px}
.qhead{margin-bottom:8px}
.pill{padding:4px 12px;font-size:.8rem}
.qtext{font-size:1.1rem;line-height:1.35;margin:0 0 12px}
.opts{gap:8px}
.opt{padding:10px 12px;min-height:48px;font-size:.95rem;gap:12px;border-radius:12px}
.radio{width:22px;height:22px}
.radio::after{inset:3px}
.qnav{margin-top:12px;gap:10px}
.qnav .btn{min-height:48px;font-size:.98rem}
.qnav{flex-wrap:wrap}
.qnav .hint{flex:1 0 100%}
/* ===== tour ===== */
.tour{position:fixed;inset:0;z-index:70;pointer-events:none}
.tour .tb{position:fixed;background:rgba(8,14,28,.62);pointer-events:auto}
.tour .thole{position:fixed;border-radius:14px;box-shadow:0 0 0 3px var(--mark),0 0 0 7px rgba(255,212,71,.35);pointer-events:none;animation:tpulse 1.4s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 3px var(--mark),0 0 0 12px rgba(255,212,71,.15)}}
.tour .tcard{position:fixed;pointer-events:auto;background:var(--sheet);color:var(--ink);border-radius:16px;padding:16px 16px 12px;box-shadow:0 14px 40px rgba(0,0,0,.35);border:1px solid var(--line)}
.tour .tstep{font-size:.75rem;color:var(--muted);margin-bottom:2px}
.tour h3{margin:0 0 6px;font-size:1.08rem}
.tour p{margin:0 0 10px;font-size:.92rem;line-height:1.45}
.tour .ttry{color:var(--blue);font-weight:600;font-size:.86rem}
.tour .tbtns{display:flex;align-items:center;gap:8px}
.tour .tbtns .btn{width:auto;min-height:40px;padding:8px 14px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.tour .thole{animation:none}}

/* Dedicated theme panel: opens in place and never navigates away from the current page. */
.theme-panel-backdrop{position:fixed;inset:0;z-index:10000;background:rgba(8,16,32,.58);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.theme-panel{width:min(100%,560px);max-height:min(90dvh,780px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
.theme-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.theme-panel-head h2{margin:0;font-size:1.35rem}
.theme-panel-close{width:42px;height:42px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);font-size:1.35rem}
.theme-panel .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.theme-panel .theme-picker{margin:8px 0 18px}
@media(max-width:420px){.theme-panel{padding:16px}.theme-panel .theme-grid{grid-template-columns:1fr}}


/* Bottom appearance and language controls for landing, login, and create-account screens only */
.auth-bottom-options{width:min(100%,490px);display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px auto 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:auto}
.auth-option{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:9px 10px;border:1px solid var(--line);border-radius:15px;background:var(--sheet);color:var(--ink);font:inherit;font-size:.92rem;font-weight:700;box-shadow:0 3px 12px rgba(20,35,65,.08)}
.auth-option-icon{font-size:1.1rem}.auth-option-change{font-size:.76rem;color:var(--accent);font-weight:800}
.auth-switch{width:36px;height:20px;flex:none;display:inline-flex;align-items:center;padding:2px;border-radius:99px;background:var(--line)}
.auth-switch i{display:block;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:transform .18s}
.auth-welcome .auth-bottom-options{margin-top:auto}
@media(max-width:380px){.auth-bottom-options{gap:7px}.auth-option{font-size:.82rem;padding:8px 5px;gap:5px}}

</style>

const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle = arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function numOpts(ans, spread){
  const set = new Set([ans]); let guard=0;
  while(set.size<4 && guard++<50){
    const d = rnd(1,spread)*(Math.random()<.5?-1:1);
    const v = ans+d; if(v>=0) set.add(v);
  }
  let k=1; while(set.size<4) set.add(ans+spread+(k++));
  return [ans, ...[...set].filter(v=>v!==ans)].map(String);
}

/* ---------------- Generated question engine ---------------- */
const LV_IDX={junior:0,middle:1,senior:2,advanced:3};
const GEN_BY_KEY={}; GEN.forEach(g=>GEN_BY_KEY[g.key]=g);
const BIN_NUMS={1:[3,5,6,7,9,10,11,12,13,14,15],2:[17,20,25,31,33,42,48,50,57,63],3:[65,77,96,100,127,128,150,200,255,170]};
function genRow(g,i){ const r=(g.custom||g.items)[i]; return r; }
function genBuild(id, oiIn, oIn){
  const [key, si, dir] = id.split(":"); const i=+si;
  if(key==="bin"){
    const n=i, b=n.toString(2);
    const q = dir==="f" ? B(`What is ${n} in binary?`,`దశాంశ సంఖ్య ${n} ను బైనరీలో ఎలా రాస్తారు?`) : B(`What is binary ${b} in decimal?`,`బైనరీ ${b} దశాంశంలో ఎంత?`);
    let o=oIn; if(!o){ const ans = dir==="f"?b:String(n); const set=new Set([ans]); let g=0;
      while(set.size<4 && g++<80){ const d=n+rnd(-6,6); if(d>0&&d!==n) set.add(dir==="f"?d.toString(2):String(d)); }
      o=shuffle([...set]); }
    return {q, opts:o.map(x=>B(x)), ans:o.indexOf(dir==="f"?b:String(n)), o};
  }
  if(key==="cat"){
    const ci=Math.floor(i/100), ii=i%100, c=CATS[ci];
    let oi=oiIn;
    if(!oi){ const others=[]; CATS.forEach((c2,k)=>{ if(k!==ci && c2.topic===c.topic) c2.items.forEach((_,j)=>others.push(k*100+j)); });
      oi=shuffle([i,...shuffle(others).slice(0,3)]); }
    const it=x=>{const cc=CATS[Math.floor(x/100)].items[x%100]; return B(cc[0],cc[1]);};
    return {q:B(`Which of these is a ${c.name[0]}?`,`వీటిలో ${c.name[1]} ఏది?`), opts:oi.map(it), ans:oi.indexOf(i), oi};
  }
  if(key==="ev"||key==="team"){
    const r = key==="ev"?EVENTS[i]:TEAMSIZE[i];
    const q = key==="ev" ? B(`In which year ${r[0]}?`,`${r[1]} — ఏ సంవత్సరంలో?`) : B(`How many players does a ${r[0]} team have on the field/court?`,`${r[1]} జట్టులో మైదానంలో/కోర్టులో ఎంత మంది ఆటగాళ్ళు ఉంటారు?`);
    const ans=String(r[2]); let o=oIn; if(!o){ o=shuffle(numOpts(r[2], key==="ev"?12:4)); }
    return {q, opts:o.map(x=>B(x)), ans:o.indexOf(ans), o};
  }
  const g=GEN_BY_KEY[key]; if(!g) return null;
  if(g.custom){
    const r=g.custom[i]; const kind=r[0], word=r[1];
    const all=[r[2],r[3],r[4],r[5]];
    let oi=oiIn; if(!oi) oi=shuffle([0,1,2,3]);
    return {q:B(g.q[0](word,kind), g.q[1](word,kind)), opts:oi.map(k=>B(all[k])), ans:oi.indexOf(0), oi};
  }
  const r=g.items[i];
  const xEn=r[0], xTe=r[1]||r[0];
  if(g.fixedOpts){
    let oi=oiIn; if(!oi) oi=shuffle([0,1,2,3]);
    return {q:B(g.q[0](xEn), g.q[1](xTe)), opts:oi.map(k=>B(g.fixedOpts[k][0],g.fixedOpts[k][1])), ans:oi.indexOf(r[2]), oi};
  }
  const ansOf = (row)=> dir==="r" ? B(row[0], row[1]||row[0]) : B(row[2], row[3]||row[2]);
  let oi=oiIn;
  if(!oi){
    const mine=ansOf(r).en, used=new Set([mine]), pool=[];
    const other = dir==="r" ? (row=>row[2]) : (row=>JSON.stringify(row[0]));
    const cand=shuffle(g.items.map((row,k)=>k).filter(k=>k!==i && other(g.items[k])!==other(r)));
    cand.sort((a,b)=>Math.abs(g.items[a][4]-r[4])-Math.abs(g.items[b][4]-r[4]));
    for(const k of cand){ const e=ansOf(g.items[k]).en; if(!used.has(e)){ used.add(e); pool.push(k); } if(pool.length===3) break; }
    oi=shuffle([i,...pool]);
  }
  let q;
  if(g.qa) q=B(xEn[0], xEn[1]);
  else if(dir==="r") q=B(g.rev[0](r[2]), g.rev[1](r[3]||r[2]));
  else q=B(g.q[0](xEn), g.q[1](xTe));
  return {q, opts:oi.map(k=>ansOf(g.items[k])), ans:oi.indexOf(i), oi};
}
function genCandidates(topic, region, lv, exact){
  const L=typeof exact==="number"?exact:(LV_IDX[lv]??1), ok=v=>v===L, out=[];
  GEN.forEach(g=>{
    if(g.topic!==topic || (region? g.region!==region : !!g.region)) return;
    const rows=g.custom||g.items;
    rows.forEach((r,i)=>{ const v=g.custom?r[6]:r[4]; if(!ok(v)) return;
      out.push(g.key+":"+i+":f"); if(g.rev) out.push(g.key+":"+i+":r"); });
  });
  if(!region){
    CATS.forEach((c,ci)=>{ if(c.topic===topic && ok(c.lv)) c.items.forEach((_,ii)=>out.push("cat:"+(ci*100+ii)+":f")); });
    if(topic==="computers" && L>=1) (BIN_NUMS[L]||[]).forEach(n=>{ out.push("bin:"+n+":f"); out.push("bin:"+n+":r"); });
    if(topic==="history") EVENTS.forEach((r,i)=>{ if(ok(r[3])) out.push("ev:"+i+":f"); });
    if(topic==="sports") TEAMSIZE.forEach((r,i)=>{ if(ok(r[3])) out.push("team:"+i+":f"); });
  }
  return out;
}
function genQuestion(id, sub){
  const b=genBuild(id); if(!b) return null;
  return {q:b.q, opts:b.opts, ans:b.ans, pick:null, t:0, sub, gid:id, oi:b.oi, o:b.o, sid:id};
}

function bankItems(key, lv){
  return BANK[key][lv].map((item,k)=>{
    const te = BANK_TE[key][lv][k];
    return [B(item[0],te[0]), item[1].map((o,j)=>B(o, te[1]?te[1][j]:o)), {s:key,lv,k}];
  });
}
function bankQuestion(id, sub){
  const [,key,blv,ks]=id.split(":"); const k=+ks;
  const item=BANK[key][blv][k], te=BANK_TE[key][blv][k];
  const opts=item[1].map((o,j)=>B(o, te[1]?te[1][j]:o)), q=B(item[0],te[0]);
  const o=shuffle(opts);
  return {q,opts:o,ans:o.indexOf(opts[0]),pick:null,t:0,sub,ref:{s:key,lv:blv,k},perm:o.map(x=>opts.indexOf(x)),sid:id};
}
function buildQuiz(subjects, cls, region, opt={}){
  const lv = opt.lv || level(cls), mc = opt.mc || cls, per = subjects.length===1 ? [8] : [4,4];
  const acct=me(); if(acct && !acct.seen) acct.seen={};
  const seenAll=(acct&&acct.seen)||{};
  const pick=(ids,k,set,key)=>{
    if(k<=0||!ids.length) return [];
    let un=ids.filter(id=>!set.has(id));
    if(un.length<k){ ids.forEach(id=>set.delete(id)); if(seenAll[key]) seenAll[key]=seenAll[key].filter(id=>!ids.includes(id)); un=ids.slice(); }
    return shuffle(un).slice(0,k);
  };
  const bankIds=(bk,blv)=> BANK[bk]&&BANK[bk][blv] ? BANK[bk][blv].map((_,k)=>`b:${bk}:${blv}:${k}`) : [];
  const topicQs=(s,n)=>{
    if(s==="maths"){
      const seen=new Set();const pool=[];let g=0;
      while(pool.length<n&&g++<100){const [q,o]=mathQ(mc);if(!seen.has(q.en)){seen.add(q.en);pool.push([q,o.map(x=>B(x))])}}
      return pool.map(([q,opts])=>{const o=shuffle(opts);return {q,opts:o,ans:o.indexOf(opts[0]),pick:null,t:0,sub:s}});
    }
    const key=s+"|"+lv, set=new Set(seenAll[key]||[]);
    const L=LV_IDX[lv], prevLv=["junior","middle","senior","advanced"][L-1];
    const rk=region? s+"_"+region : null, rlvOf=x=>rk&&BANK[rk] ? (BANK[rk][x]?x:"senior") : null;
    const general=[...bankIds(s,lv), ...genCandidates(s,null,lv,L)];
    const nextLv=["junior","middle","senior","advanced"][L+1];
    const general2= L>=1 ? [...bankIds(s,prevLv), ...genCandidates(s,null,prevLv,L-1)] : [];
    const general3= nextLv ? [...bankIds(s,nextLv), ...genCandidates(s,null,nextLv,L+1)] : [];
    const regional = region ? [...(rlvOf(lv)?bankIds(rk,rlvOf(lv)):[]), ...genCandidates(s,region,lv,L)] : [];
    const regional2 = region && L>=1 ? [...(rlvOf(prevLv)&&rlvOf(prevLv)!==rlvOf(lv)?bankIds(rk,rlvOf(prevLv)):[]), ...genCandidates(s,region,prevLv,L-1)] : [];
    const unseen=list=>shuffle(list.filter(id=>!set.has(id)));
    const take=(lists,k,chosen)=>{ for(const l of lists){ for(const id of unseen(l)){ if(chosen.length>=k) return chosen; if(!chosen.includes(id)) chosen.push(id); } } return chosen; };
    let ids=[];
    const nReg = regional.length+regional2.length && n>1 ? Math.round(n*0.7) : 0;
    if(nReg) take([regional,regional2], nReg, ids);
    take([general,general2,general3], n, ids);
    if(ids.length<n){ take([regional,regional2], n, ids); }
    if(ids.length<n){
      const all=[...regional,...regional2,...general,...general2,...general3];
      all.forEach(id=>set.delete(id)); if(seenAll[key]) seenAll[key]=[];
      if(nReg) take([regional,regional2], nReg, ids);
      take([general,general2,general3], n, ids);
    }
    return ids.map(id=>{ const q = id.startsWith("b:") ? bankQuestion(id,s) : genQuestion(id,s); if(q) q.lvk=lv; return q; }).filter(Boolean);
  };
  let main=[];
  subjects.forEach((s,i)=>{ main=main.concat(topicQs(s,per[i])); });
  const others=shuffle(SUBJECTS.map(x=>x.id).filter(id=>!subjects.includes(id))).slice(0,2);
  const extra=others.map(s=>{ const q=topicQs(s,1)[0]; if(q) q.opt=true; return q; }).filter(Boolean);
  return shuffle([...main, ...extra]);
}
function markSeen(qs){
  const acct=me(); if(!acct) return; acct.seen=acct.seen||{};
  qs.forEach(q=>{ if(!q.sid||!q.lvk) return; const key=q.sub+"|"+q.lvk; const arr=acct.seen[key]||(acct.seen[key]=[]); if(!arr.includes(q.sid)) arr.push(q.sid); if(arr.length>800) arr.splice(0,arr.length-800); });
}

function packQ(q){
  const base = q.gid ? {g:q.gid,oi:q.oi,o:q.o,a:q.ans,c:q.pick,t:q.t,s:q.sub} : q.ref ? {r:[q.ref.s,q.ref.lv,q.ref.k],p:q.perm,a:q.ans,c:q.pick,t:q.t,s:q.sub}
               : {q:q.q,o:q.opts.map(x=>typeof x==="string"?x:x.en),a:q.ans,c:q.pick,t:q.t,s:q.sub};
  if(q.opt) base.x=1;
  return base;
}
function unpackQ(x){
  try{
    if(x.g){ const b=genBuild(x.g, x.oi, x.o); if(b) return {q:b.q,opts:b.opts,ans:x.a,pick:x.c,t:x.t,sub:x.s,opt:!!x.x}; }
    if(x.r){const [s,lv,k]=x.r, e=BANK[s][lv][k], te=BANK_TE[s][lv][k];
      const all=e[1].map((o,j)=>B(o,te[1]?te[1][j]:o));
      return {q:B(e[0],te[0]),opts:x.p.map(i=>all[i]),ans:x.a,pick:x.c,t:x.t,sub:x.s,opt:!!x.x};}
    if(x.o) return {q:x.q,opts:x.o,ans:x.a,pick:x.c,t:x.t,sub:x.s,opt:!!x.x};
  }catch(e){}
  return x;
}

const GOOGLE_SHEETS_WEB_APP_URL = "";
function sendQuizDataToSheets(payload){
  if(!GOOGLE_SHEETS_WEB_APP_URL || !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:$|\?)/.test(GOOGLE_SHEETS_WEB_APP_URL)) return;
  try {
    fetch(GOOGLE_SHEETS_WEB_APP_URL, {
      method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload), keepalive:true
    }).catch(()=>{});
  } catch(e) {}
}
function syncQuizUserToSheets(username, account){
  if(!account) return;
  sendQuizDataToSheets({type:"user", username, name:account.name||"", role:account.role||"student",
    category:account.cat||"", classLevel:account.cls||"", age:Number(account.age)||null,
    gender:account.gender||"", state:account.state||"", language:account.lang||"en",
    joined:new Date(account.created||Date.now()).toISOString()});
}
function syncQuizResultToSheets(username, account, attempt){
  if(!account || !attempt) return;
  // Never send passwords, password salts, email, phone, address, photos, or individual answers.
  syncQuizUserToSheets(username, account);
  sendQuizDataToSheets({type:"result", username, date:attempt.date||new Date().toISOString(),
    topics:Array.isArray(attempt.subjects)?attempt.subjects:[], classLevel:attempt.cls||account.cls||"",
    level:attempt.lvl||"", score:Number(attempt.correct)||0, total:Number(attempt.total)||0,
    timeTakenMs:Number(attempt.time)||0});
}

let S = {accounts:{}, session:null};
let dbRef=null, writeChain=Promise.resolve(), sumRef=null, dbCap=null, userCap=null, myId=null;
try{const raw=localStorage.getItem(LS_KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
// Migrate the previous combined Light/Dark/theme setting into independent controls.
if(!S.appearance) S.appearance = (S.theme==="dark") ? "dark" : "light";
if(!["light","dark"].includes(S.appearance)) S.appearance="light";
if(!["ocean","forest","sunset","lavender"].includes(S.theme)) S.theme="ocean";

const PH_KEY="quiztime.photos.v1"; let PH={}, phRef=null, phChain=Promise.resolve();
try{const raw=localStorage.getItem(PH_KEY);if(raw)PH=JSON.parse(raw)||{}}catch(e){}
function savePhotos(){
  PH.__updated=Date.now();
  try{localStorage.setItem(PH_KEY,JSON.stringify(PH))}catch(e){}
  if(phRef){const snap=JSON.parse(JSON.stringify(PH));phChain=phChain.then(()=>phRef.set(snap)).catch(()=>{})}
  scheduleSummary();
  updateBar();
}
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){const snap=JSON.parse(JSON.stringify(S));writeChain=writeChain.then(()=>dbRef.set(snap)).catch(()=>{})}
  if(typeof scheduleSummary==="function") scheduleSummary();
}
let syncDone=false, syncResolve; const syncReady=new Promise(r=>syncResolve=r);
function finishSync(){ if(!syncDone){ syncDone=true; syncResolve(); } }
setTimeout(finishSync, 6000);
async function connectDb(){
  try{
    const [user, db] = await Promise.all([window.claude?.use?.("user"), window.claude?.use?.("db")]);
    const id = user ? await user.id() : null;
    if(!db||!id) return finishSync();
    dbCap=db; userCap=user; myId=id; sumRef=db.doc(`summaries/${id}`);
    phRef = db.doc(`data/users/${id}/photos`);
    dbRef = db.doc(`data/users/${id}/quiz`);
    const [snap, ps] = await Promise.all([dbRef.get(), phRef.get().catch(()=>null)]);
    if(snap.exists){
      const remote = snap.data()||{};
      const localNewer = (S.updated||0) > (remote.updated||0);
      const remoteNewer = (remote.updated||0) > (S.updated||0);
      for(const k in (remote.accounts||{})){
        if(!S.accounts[k]) S.accounts[k]=remote.accounts[k];
        else if(remoteNewer) Object.assign(S.accounts[k], remote.accounts[k]);
      }
      if(remoteNewer){ S.session = S.session || remote.session || null; S.lang = remote.lang || S.lang; S.theme = remote.theme || S.theme; S.updated=remote.updated; }
      if(localNewer) save();
      try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
    } else if(Object.keys(S.accounts).length){ save(); }
    if(ps && ps.exists){ const r=ps.data()||{};
      if((r.__updated||0)>(PH.__updated||0)){ PH=Object.assign({},r); try{localStorage.setItem(PH_KEY,JSON.stringify(PH))}catch(e){} }
      else if((PH.__updated||0)>(r.__updated||0)) savePhotos();
    } else if(PH.__updated) savePhotos();
    finishSync();
    if(route.name==="login"||route.name==="forgot"){ updateBar(); }
    else if(route.name==="loading") render();
    else if(route.name==="profile") { updateBar(); vProfile(); }
    else updateBar();
    try{ delUnsub=db.doc("control/deletions").onSnapshot(ds=>{ if(ds.exists){ const d=ds.data()||{}; DEL={attempts:d.attempts||[],users:d.users||[]}; applyDeletions(); } },()=>{}); }catch(e){}
    scheduleSummary();
  }catch(e){ dbRef=null; finishSync(); }
}

async function hash(pw, salt){
  const txt = salt+":"+pw;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){let h=0;for(const ch of txt){h=(h*31+ch.charCodeAt(0))|0}return "x"+h}
}

async function goBack(){

function avatarHTML(un, cls){
  const ph=PH[un], a=S.accounts[un];
  // Reuse the same avatar source for the top-right icon and the large profile picture.
  if(ph) return `<img class="${cls}" src="${ph}" alt="Profile photo">`;
  if(a && (a.gender==="female" || a.gender==="male"))
    return `<img class="${cls}" src="${a.gender==="female" ? AV_GIRL : AV_BOY}" alt="Profile avatar">`;
  return `<img class="${cls}" src="${AV_GIRL}" alt="Profile avatar">`;
}
function readPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const n=Math.min(img.naturalWidth,img.naturalHeight), sz=240, c=document.createElement("canvas");
      c.width=c.height=sz;
      c.getContext("2d").drawImage(img,(img.naturalWidth-n)/2,(img.naturalHeight-n)/2,n,n,0,0,sz,sz);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.8));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};
    img.src=url;
  });
}

  return `<label class="avedit" aria-label="${t("changePhoto")}">

}

const thumbCache={};
function thumb(src){
  if(!src) return Promise.resolve(null);
  if(thumbCache[src]) return Promise.resolve(thumbCache[src]);

    img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=72;c.getContext("2d").drawImage(img,0,0,72,72);res(thumbCache[src]=c.toDataURL("image/jpeg",.7))};

let DEL={attempts:[],users:[]}, delRef=null, delUnsub=null;
const userDeleted=(dev,un,created)=>DEL.users.some(x=>x.d===dev&&x.u===un&&(x.ts||0)>(created||0));

function applyDeletions(){
  if(!myId) return;
  let changed=false, phChanged=false;
  for(const un of Object.keys(S.accounts)){
    const a=S.accounts[un];
    if(userDeleted(myId,un,a.created)){
      delete S.accounts[un]; changed=true;
      if(PH[un]){ delete PH[un]; phChanged=true; }
      if(S.session===un){ S.session=null; }
      continue;
    }
    const before=(a.history||[]).length;
    a.history=(a.history||[]).filter(x=>!attDeleted(myId,un,x.id));
    if(a.history.length!==before) changed=true;
  }
  if(changed){ save(); if(phChanged) savePhotos(); if(route.name!=="quiz") render(); }
}
async function adminDelete(kind, dev, un, id){
  const msg = kind==="user" ? t("delUserAsk") : t("delAsk");
  if(!(await ask(msg,{danger:true, ok:kind==="user"?t("delUserOk"):t("delOk")}))) return;
  const local = dev==="local" || dev===myId;
  if(local){
    const a=S.accounts[un];
    if(a){
      if(kind==="user"){ delete S.accounts[un]; if(PH[un]){ delete PH[un]; savePhotos(); } }
      else a.history=(a.history||[]).filter(x=>x.id!==id);
      save();
    }
  }
  if(!local || (myId && dbCap)){
    try{
      const ref=dbCap.doc("control/deletions"), snap=await ref.get();
      const cur=snap.exists?(snap.data()||{}):{};
      const next={attempts:Array.isArray(cur.attempts)?cur.attempts.slice():[], users:Array.isArray(cur.users)?cur.users.slice():[]};
      if(kind==="user") next.users.push({d:dev,u:un,ts:Date.now()});
      else next.attempts.push({d:dev,u:un,a:id});
      next.attempts=next.attempts.slice(-2000); next.users=next.users.slice(-500);
      await ref.set(next); DEL=next;
    }catch(e){ if(!local){ toast(t("delFail")); return; } }
  }
  toast(kind==="user"?t("okUserDeleted"):t("okDeleted"));
  vAdmin();
}

/* ---------------- In-app confirm dialog ---------------- */
function ask(msg, o={}){
  return new Promise(res=>{
    const prev=document.activeElement;
    const w=document.createElement("div");
    w.className="modal";
    w.innerHTML=`<div class="mbox" role="alertdialog" aria-modal="true" aria-labelledby="mmsg">
        <p id="mmsg">${esc(msg)}</p>
        <div class="row"><button class="btn ghost" data-r="0">${t("cancel")}</button><button class="btn ${o.danger?"danger":""}" data-r="1">${esc(o.ok||t("okBtn"))}</button></div>
      </div>`;
    const done=v=>{ w.classList.remove("show"); setTimeout(()=>w.remove(),180); document.removeEventListener("keydown",key); try{prev&&prev.focus()}catch(e){} res(v); };
    const key=e=>{ if(e.key==="Escape") done(false); };
    w.addEventListener("click",e=>{ if(e.target===w) done(false); const b=e.target.closest("[data-r]"); if(b) done(b.dataset.r==="1"); });
    document.addEventListener("keydown",key);
    document.body.appendChild(w);
    requestAnimationFrame(()=>w.classList.add("show"));
    w.querySelector('[data-r="1"]').focus();
  });
}

function tourPlace(){
  if(!TOUR) return;
  const st=TOUR.steps[TOUR.i], target=st.sel?document.querySelector(st.sel):null;
  const hole=TOUR.el.querySelector(".thole"), card=TOUR.el.querySelector(".tcard"); if(!hole||!card) return;
  const W=innerWidth, H=innerHeight, pad=6;
  let r = target ? target.getBoundingClientRect() : null;
  const box = r ? {x:Math.max(4,r.left-pad), y:Math.max(4,r.top-pad), w:Math.min(W-8,r.width+pad*2), h:r.height+pad*2} : null;
  const set=(el,x,y,w,h)=>Object.assign(el.style,{left:x+"px",top:y+"px",width:Math.max(0,w)+"px",height:Math.max(0,h)+"px"});
  const b=k=>TOUR.el.querySelector(`[data-b="${k}"]`);
  if(box && !st.tap){ set(b("t"),0,0,W,box.y); set(b("b"),0,box.y+box.h,W,H-box.y-box.h); set(b("l"),0,box.y,box.x,box.h); set(b("r"),box.x+box.w,box.y,W-box.x-box.w,box.h); }
  else if(box && st.tap){ set(b("t"),0,0,W,box.y); set(b("b"),0,box.y+box.h,W,H-box.y-box.h); set(b("l"),0,box.y,box.x,box.h); set(b("r"),box.x+box.w,box.y,W-box.x-box.w,box.h); }
  else { set(b("t"),0,0,W,H); ["l","r","b"].forEach(k=>set(b(k),0,0,0,0)); }
  if(box){ hole.style.display="block"; set(hole,box.x,box.y,box.w,box.h); hole.style.pointerEvents=st.tap?"none":"auto"; } else hole.style.display="none";
  const cw=Math.min(340,W-24); card.style.width=cw+"px";
  const ch=card.offsetHeight;
  let cx = box ? Math.min(Math.max(12, box.x+box.w/2-cw/2), W-cw-12) : (W-cw)/2;
  let cy = box ? (box.y+box.h+12+ch < H ? box.y+box.h+12 : Math.max(12, box.y-ch-12)) : Math.max(12,(H-ch)/2);
  card.style.left=cx+"px"; card.style.top=cy+"px";
}

function wireAddress(){
  const pin=document.getElementById("apin"), st=document.getElementById("astatus");
  const $=id=>document.getElementById(id), sel=$("astate");
  const say=(cls,msg)=>{ st.className="astatus "+cls; st.textContent=msg; };
  const setState=name=>{ const m=STATES.find(x=>x.toLowerCase()===String(name||"").toLowerCase()); if(m) sel.value=m; return m; };
  const getJSON=async url=>{ const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),7000);
    try{ const r=await fetch(url,{signal:ctl.signal}); return await r.json(); } finally{ clearTimeout(tm); } };
  let last="";
  const byPin=async()=>{
    const p=digits(pin.value);
    if(p.length!==6 || p===last) return;
    last=p; say("",t("pinFinding"));
    const offState=stateFromPin(p), offDist=PIN_DIST[+p.slice(0,3)];
    if(offState) sel.value=offState;
    if(offDist && !$("adist").value) $("adist").value=offDist;
    try{
      const j=await getJSON("https://api.postalpincode.in/pincode/"+p);
      const po=j&&j[0]&&j[0].Status==="Success"?j[0].PostOffice:null;
      if(!po||!po.length) throw 0;
      const a=po[0];
      $("adist").value=a.District||$("adist").value;
      if(!$("aarea").value) $("aarea").value=a.Name||"";
      $("aareas").innerHTML=po.map(o=>`<option value="${esc(o.Name)}">`).join("");
      setState(a.State);
      say("ok",t("pinFound"));
    }catch(e){
      if(offState) say("ok", offDist ? t("pinDistOnly")(offDist, stateName(offState)) : t("pinStateOnly")(stateName(offState)));
      else say("bad",t("pinFail"));
      last="";
    }
  };
  const byPlace=async()=>{
    const area=$("aarea").value.trim(), dist=$("adist").value.trim();
    const q=area||dist;
    if(!q){ say("bad",t("findHint")); return; }
    say("",t("pinFinding"));
    try{
      const j=await getJSON("https://api.postalpincode.in/postoffice/"+encodeURIComponent(q));
      let po=j&&j[0]&&j[0].Status==="Success"?j[0].PostOffice:null;
      if(!po||!po.length) throw 0;
      if(dist && area){ const f=po.filter(o=>(o.District||"").toLowerCase().includes(dist.toLowerCase())); if(f.length) po=f; }
      const a=po[0];
      if(a.Pincode) pin.value=a.Pincode;
      if(!$("adist").value) $("adist").value=a.District||"";
      setState(a.State);
      last=digits(pin.value);
      say("ok",t("addrFound"));
    }catch(e){
      const s2=placeState(dist)||placeState(area);
      if(s2){ sel.value=s2; say("ok",t("addrStateOnly")(stateName(s2))); }
      else say("bad",t("addrFail"));
    }
  };
  pin.oninput=()=>{ pin.value=digits(pin.value).slice(0,6); if(pin.value.length===6) byPin(); };
  $("afind").onclick=()=>{ last=""; const p=digits(pin.value);
    if(p.length===6) byPin(); else if(p.length) say("bad",t("errPin")); else byPlace(); };
  const autoState=()=>{ if(!sel.value){ const s2=placeState($("adist").value)||placeState($("aarea").value); if(s2){ sel.value=s2; say("ok",t("addrStateOnly")(stateName(s2))); } } };
  $("adist").addEventListener("change",autoState); $("aarea").addEventListener("change",autoState);
}

/* ---------------- Account helpers ---------------- */
const digits = v=>String(v||"").replace(/\D/g,"");
const phoneKey = v=>{const d=digits(v); return d.length>10 ? d.slice(-10) : d;};
const validEmail = v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const validPhone = v=>{const d=digits(v); return d.length>=10 && d.length<=13;};
function findAccounts(id){
  id=String(id||"").trim().toLowerCase();
  if(!id) return [];
  if(S.accounts[id]) return [id];
  const pk=phoneKey(id);
  if(pk.length===10 && /^[+\d\s()-]+$/.test(id)) return Object.keys(S.accounts).filter(u=>phoneKey(S.accounts[u].phone)===pk);
  return [];
}

      if(!matches.length && !syncDone){ const btn=e.submitter||document.querySelector("#f .btn"); btn.disabled=true; btn.textContent=t("loadingTxt"); await syncReady; btn.disabled=false; btn.textContent=t("login"); matches=findAccounts(val("un")); }
      if(!matches.length) return err("errNoAccId");
      if(!pw) return err("errPw");
      let ok=null;
      for(const un of matches){ const a=S.accounts[un]; if(await hash(pw,a.salt)===a.pass){ ok=un; break; } }
      if(!ok) return err("errWrongPw");
      { const A=S.accounts[ok]; if(!A.lang) A.lang = (A.age||0)>30 ? "te" : (S.lang||"en"); S.lang=A.lang; }
      S.session=ok; save(); go(PH[ok]?homeRoute():"photo"); toast(t("okLogin")(S.accounts[ok].name));
    }
  };
}

let fpTries=0;
function vForgot(){
  const step=route.step||1, a=route.un?S.accounts[route.un]:null;
  if(step>1 && !a){ route={name:"forgot",step:1}; return vForgot(); }
  const body = step===1 ? `
      <p class="lead">${t("fpLead1")}</p>
      ${field("fid",t("idLabel"),`autocomplete="username" autocapitalize="none" placeholder="${t("idPh")}"`)}
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">${t("nextBtn")}</button>`
    : step===2 ? `
      <p class="lead">${t("fpLead2")}</p>
      ${a.email?field("fem",t("emailLbl"),`type="email" autocapitalize="none" placeholder="${t("savedHint")(maskEmail(a.email))}"`):""}
      ${a.phone?field("fph",t("phoneLbl"),`type="tel" inputmode="tel" placeholder="${t("savedHint")(maskPhone(a.phone))}"`):""}
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">${t("verify")}</button>`
    : `
      <p class="lead">${t("fpLead3")}</p>
      ${field("np1",t("newPw"),`type="password" autocomplete="new-password" placeholder="${t("pwPh")}"`)}
      ${field("np2",t("confirmPw"),`type="password" autocomplete="new-password"`)}
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">${t("updatePw")}</button>`;
  $app.innerHTML=`
    <h1>${t("fpTitle")}</h1>
    <div class="steps" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=step?"on":""}"></i>`).join("")}</div>
    <form class="sheet" id="ff" novalidate>${body}</form>`;
  const err=k=>document.getElementById("err").textContent=t(k);
  const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  document.getElementById("ff").onsubmit=async e=>{
    e.preventDefault();
    if(step===1){
      if(!syncDone) await syncReady;
      const m=findAccounts(val("fid"));
      if(!m.length) return err("errNoAccId");
      if(m.length>1) return err("errMulti");
      const acc=S.accounts[m[0]];
      if(!acc.email && !acc.phone) return err("errNoRec");
      go("forgot",{step:2,un:m[0]});
    } else if(step===2){
      if(fpTries>=5) return err("errTooMany");
      const okE=!a.email || val("fem").toLowerCase()===a.email.toLowerCase();
      const okP=!a.phone || (phoneKey(val("fph")) && phoneKey(val("fph"))===phoneKey(a.phone));
      if(!(okE&&okP)){ fpTries++; return err(fpTries>=5?"errTooMany":"errVerify"); }
      fpTries=0; go("forgot",{step:3,un:route.un,ok:true});
    } else {
      if(!route.ok) return go("forgot",{step:1});
      const p1=document.getElementById("np1").value, p2=document.getElementById("np2").value;
      if(p1.length<4) return err("errPw");
      if(p1!==p2) return err("errMatch");
      a.salt=Math.random().toString(36).slice(2,10); a.pass=await hash(p1,a.salt); save();
      go("login"); toast(t("okPwReset"));
    }
  };
}

function vQuiz(){
  const Z=route.quiz, Q=Z.qs[Z.i], last=Z.i===Z.qs.length-1;
  $app.innerHTML=`
    <div class="clock" aria-live="off">
      <div class="now"><div class="k">${t("thisQ")}</div><div class="v" id="tq">00:00</div></div>
      <div><div class="k">${t("totalTime")}</div><div class="v" id="tt">00:00</div></div>
    </div>
    <div class="prog" aria-hidden="true">${Z.qs.map((q,k)=>`<i class="${k===Z.i?"cur":q.pick!==null?"done":""}"></i>`).join("")}</div>
    <div class="qcard">
      <div class="qhead"><span class="pill">${subName(Q.sub)}${Q.opt?` · ${t("optional")}`:""}</span><span class="qnum">${t("qOf")(Z.i+1,Z.qs.length)}</span></div>
      <p class="qtext" id="qt">${esc(L(Q.q))}</p>
      <div class="opts" role="radiogroup" aria-labelledby="qt">
        ${Q.opts.map((o,k)=>`<button class="opt" role="radio" aria-checked="${Q.pick===k}" data-k="${k}"><span class="radio"></span><span class="otext">${LETTERS[k]}. ${esc(L(o))}</span></button>`).join("")}
      </div>
    </div>
    <div class="qnav">
      <button class="btn prev" id="pv" ${Z.i===0?"disabled":""}><span aria-hidden="true">←</span> ${t("prevQ")}</button>
      <button class="btn" id="nx" ${Q.pick===null&&!Q.opt?"disabled":""}>${Q.pick===null&&Q.opt?t("skip1"):(last?t("finish"):t("nextQ"))} <span aria-hidden="true">${last&&!(Q.pick===null&&Q.opt)?"✓":"→"}</span></button>
      ${Q.opt?`<p class="hint center" style="width:100%;margin:6px 0 0">${t("optHint")}</p>`:""}
    </div>`;
  const tq=document.getElementById("tq"), tt=document.getElementById("tt");
  const upd=()=>{const n=Date.now();tq.textContent=fmt(Q.t+(n-Z.qStart));tt.textContent=fmt(n-Z.start)};
  upd(); tick=setInterval(upd,250);
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    Q.pick=+b.dataset.k;
    $app.querySelectorAll(".opt").forEach(x=>{x.setAttribute("aria-checked",x===b);x.classList.remove("pop")});
    void b.offsetWidth; b.classList.add("pop");
    const nx=document.getElementById("nx"); nx.disabled=false; nx.innerHTML=`${last?t("finish"):t("nextQ")} <span aria-hidden="true">${last?"✓":"→"}</span>`;
  });
  const leave=dir=>{
    const now=Date.now(); Q.t+=now-Z.qStart; Z.i+=dir; Z.qStart=now;
    clearInterval(tick); tick=null; vQuiz(); window.scrollTo(0,0);
  };
  document.getElementById("pv").onclick=()=>{ if(Z.i>0) leave(-1) };
  document.getElementById("nx").onclick=()=>{
    if(!last) return leave(1);
    const now=Date.now(); Q.t+=now-Z.qStart;
    markSeen(Z.qs);
    const correct=Z.qs.filter(q=>q.pick===q.ans).length;
    const att={id:now.toString(36),date:new Date(now).toISOString(),cls:Z.cls,lvl:Z.lvl||null,subjects:Z.subjects,total:Z.qs.length,correct,time:now-Z.start,
      qs:Z.qs.map(packQ)};
    const u=me(); u.history=[att,...(u.history||[])].slice(0,50); save();
    syncQuizResultToSheets(S.session,u,att);
    go("result",{att,fresh:true}); toast(t("okSaved"));
  };
}

function reviewHTML(att){
  return att.qs.map(unpackQ).map((q,i)=>{
    const ok=q.pick===q.ans;
    return `<div class="rev">
      <div class="top"><span>Q${i+1} · ${subName(q.sub)}${q.opt?` · ${t("optional")}`:""} · ${fmtShort(q.t)}</span><span class="${ok?"ok":"no"}">${ok?t("correct"):(q.pick===null||q.pick===undefined)?t("skipped"):t("wrong")}</span></div>
      <div class="q">${esc(L(q.q))}</div>
      <ul>${q.opts.map((o,k)=>{
        const cls=k===q.ans?"right":(k===q.pick?"wrong":"");
        const note=k===q.pick?t("yourAns"):k===q.ans?t("correctAns"):"";
        return `<li class="${cls}"><span class="bub">${LETTERS[k]}</span>${esc(L(o))}${note?`<em>${note}</em>`:""}</li>`}).join("")}</ul>
    </div>`}).join("");
}
function scoreHTML(att){
  const pct=att.correct/att.total;
  const msg=pct===1?t("m100"):pct>=.8?t("m80"):pct>=.6?t("m60"):pct>=.4?t("m40"):t("m0");
  return `<div class="sheet score">
      <div class="big">${att.correct}<span>/${att.total}</span></div>
      <div class="msg">${msg}</div>
      <div class="stats">
        <div><b>${fmt(att.time)}</b><small>${t("totalTime")}</small></div>
        <div><b>${fmtShort(att.time/att.total)}</b><small>${t("perQ")}</small></div>
        <div><b>${Math.round(pct*100)}%</b><small>${t("score")}</small></div>
      </div>
    </div>`;
}

        <span class="meta"><span class="d">${fmtDate(a.date)}</span><br>
        <span class="s">${attLabel(a)} · ${subs(a.subjects)} · ${t("correctOf")(a.correct,a.total)} · ${fmt(a.time)}</span></span>
        <span class="chev" aria-hidden="true">›</span></button>
        ${isAdmin()?`<button class="hdel" data-id="${esc(a.id)}" aria-label="${t("delOne")}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg></button>`:""}</div>`).join("")}
    </div>
    <div style="margin-top:16px"><button class="btn" id="st">${t("startNew")}</button></div>`;
  $app.querySelectorAll(".hitem").forEach(b=>b.onclick=()=>go("detail",{att:h[+b.dataset.i]}));
  $app.querySelectorAll(".hdel").forEach(b=>b.onclick=async()=>{ if(await deleteAttempt(b.dataset.id)) vHistory(); });
  document.getElementById("st").onclick=()=>go("fav");
}

function vDetail(){
  const att=route.att;
  $app.innerHTML=`
    <h1>${fmtDate(att.date)}</h1>
    <p class="lead">${attLabel(att)} · ${subs(att.subjects)}</p>
    ${scoreHTML(att)}
    <h3 class="sec">${t("qa")}</h3>
    ${reviewHTML(att)}
    ${isAdmin()?`<button class="btn logout" id="delAtt"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg> ${t("delOne")}</button>`:""}`;

<script>
(function(){
  'use strict';
  const app=document.getElementById('app');
  let enhanceQueued=false;
  function enhanceSignup(){
    const form=document.getElementById('f');
    if(!form || form.dataset.tqEnhanced==='1' || !document.getElementById('nm')) return;
    form.dataset.tqEnhanced='1';
    const children=Array.from(form.children);
    const find=(id)=>form.querySelector('#'+id);
    const wrapOf=(id)=>{
      const el=find(id); if(!el) return null;
      const label=form.querySelector('label[for="'+id+'"]');
      if(el.closest('.field-wrap')) return el.closest('.field-wrap');
      const wrap=document.createElement('div'); wrap.className='field-wrap';
      const anchor=label||el; anchor.parentNode.insertBefore(wrap,anchor);
      if(label) wrap.appendChild(label);
      wrap.appendChild(el);
      return wrap;
    };
    // Build three progressive sections while retaining the original controls and event handlers.
    const account=document.createElement('section');account.className='signup-step';account.dataset.step='1';
    const about=document.createElement('section');about.className='signup-step';about.dataset.step='2';
    const contact=document.createElement('section');contact.className='signup-step';contact.dataset.step='3';
    const progress=document.createElement('div');progress.id='signupProgress';progress.setAttribute('aria-label','Account creation progress');
    progress.innerHTML='<span class="step-caption">Step 1 of 3</span><i class="step-dot active"></i><i class="step-dot"></i><i class="step-dot"></i>';
    // Capture the role and category choices in step 1; profile preferences in step 2.
    const roleLabel=children.find(x=>x.classList?.contains('f')&&x.textContent.trim().length>0);
    const roleGroup=form.querySelector('[data-role]')?.parentElement;
    const catBlock=find('catBlock');
    const genderGroup=form.querySelector('[data-g]')?.parentElement;
    const genderLabel=genderGroup?.previousElementSibling;
    const langGroup=form.querySelector('[data-pl]')?.parentElement;
    const langLabel=langGroup?.previousElementSibling;
    const plo=find('plo'), ploLabel=plo?.previousElementSibling;
    const nm=wrapOf('nm'), un=wrapOf('un'), pw=wrapOf('pw');
    const em=wrapOf('em'), ph=wrapOf('ph'), address= form.querySelector('.addr');
    // Place the original nodes into the three steps; all IDs/listeners stay intact.
    form.insertBefore(progress,form.firstChild);
    form.insertBefore(account,progress.nextSibling);form.insertBefore(about,account.nextSibling);form.insertBefore(contact,about.nextSibling);
    const move=(node,section)=>{if(node && !section.contains(node))section.appendChild(node)};
    move(roleLabel,account);move(roleGroup,account);move(nm,account);move(un,account);move(pw,account);
    move(catBlock,about);move(genderLabel,about);move(genderGroup,about);move(langLabel,about);move(langGroup,about);move(ploLabel,about);move(plo,about);
    // Language hints were adjacent to the language selector before moving; keep them in step 2.
    const hints=Array.from(form.querySelectorAll('p.hint')).filter(p=>p.id==='ploNote'||p.textContent.trim().length>0);
    hints.forEach(p=>{if(p.id==='ploNote'||p.textContent.includes('language')||p.textContent.includes('భాష'))move(p,about)});
    move(em,contact);move(ph,contact);move(address,contact);
    const privacy=find('guardianConsentWrap');
    if(privacy) move(privacy,contact);
    const privacyNote=form.querySelector('.privacy-note');if(privacyNote)move(privacyNote,contact);
    const err=find('err'); const submit=form.querySelector('button[type="submit"]');
    const actions=document.createElement('div');actions.className='signup-actions';
    const prev=document.createElement('button');prev.type='button';prev.className='btn ghost';prev.textContent='Back';prev.hidden=true;
    const next=document.createElement('button');next.type='button';next.className='btn';next.textContent='Continue';
    actions.append(prev,next);form.insertBefore(actions,err||submit);
    let step=1;
    function showStep(n){step=Math.max(1,Math.min(3,n));[account,about,contact].forEach((x,i)=>x.hidden=i+1!==step);prev.hidden=step===1;next.hidden=step===3;submit.hidden=step!==3;submit.textContent='Create account';progress.querySelector('.step-caption').textContent='Step '+step+' of 3';progress.querySelectorAll('.step-dot').forEach((d,i)=>d.classList.toggle('active',i<step));if(err)err.textContent='';if(step===3)syncGuardian();}
    function validateStep(){
      const value=id=>find(id)?.value?.trim()||'';
      if(step===1){if(!value('nm')){if(err)err.textContent='Please enter your name.';return false}if(!/^[a-z0-9_.-]{3,20}$/.test(value('un').toLowerCase())){if(err)err.textContent='Username must be 3–20 characters (letters, numbers, ., _ or -).';return false}if((find('pw')?.value||'').length<4){if(err)err.textContent='Password must contain at least 4 characters.';return false}}
      if(step===2){const age=+(value('age'));if(find('catBlock')&&!find('catBlock').hidden&&!(age>=4&&age<=110)){if(err)err.textContent='Please enter a valid age.';return false}if(!form.querySelector('[data-g][aria-checked="true"]')){if(err)err.textContent='Please select your gender.';return false}}
      return true;
    }
    prev.addEventListener('click',()=>showStep(step-1));next.addEventListener('click',()=>{if(validateStep())showStep(step+1)});
    // Contact fields are optional; make that clear to the user.
    const emailLabel=em?.querySelector('label'); if(emailLabel&&!/optional/i.test(emailLabel.textContent))emailLabel.innerHTML+=' <span class="muted">(optional)</span>';
    const phoneLabel=ph?.querySelector('label'); if(phoneLabel&&!/optional/i.test(phoneLabel.textContent))phoneLabel.innerHTML+=' <span class="muted">(optional)</span>';
    const age=find('age');
    function syncGuardian(){const box=find('guardianConsentWrap');if(!box)return;const n=+(age?.value||0);box.hidden=!(n>=4&&n<18)&&!(n===0&&form.querySelector('[data-role="student"][aria-checked="true"]'));}
    age?.addEventListener('input',syncGuardian);form.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>setTimeout(syncGuardian,0)));syncGuardian();showStep(1);
    // A submit attempt on an earlier step should show that step rather than fail invisibly.
    form.addEventListener('submit',e=>{if(step<3){e.preventDefault();e.stopImmediatePropagation();if(validateStep())showStep(step+1)}},true);
    // Under-18 consent check is captured before the app's own submit handler.
    form.addEventListener('submit',e=>{const n=+(age?.value||0), isStudent=form.querySelector('[data-role="student"][aria-checked="true"]');if(isStudent&&n>=4&&n<18&&!find('guardianConsent')?.checked){e.preventDefault();e.stopImmediatePropagation();showStep(3);if(err)err.textContent='Please ask a parent or guardian to agree before creating this account.';find('guardianConsentWrap')?.scrollIntoView({behavior:'smooth',block:'center'});}},true);
  }
  function enhanceResult(){
    const again=document.getElementById('again');
    if(!again || document.getElementById('shareResult'))return;
    const score=document.querySelector('.score');
    const big=score?.querySelector('.big');
    const nums=(big?.textContent||'').match(/\d+/g)||[];
    if(nums.length>=2 && Number(nums[0])/Math.max(1,Number(nums[1]))>=.8)score?.classList.add('celebrate-result');
    const row=again.parentElement;
    const share=document.createElement('button');share.type='button';share.id='shareResult';share.className='btn ghost';share.textContent='Share result';share.setAttribute('aria-label','Share quiz result');row.appendChild(share);
    share.addEventListener('click',async()=>{
      const title=document.querySelector('main h1')?.textContent||'Tejaswini Quiz result';
      const detail=document.querySelector('main .lead')?.textContent||'';
      const scoreText=big?.textContent||'';
      const msg='I scored '+scoreText+' in Tejaswini Quiz! '+detail+' Try it: '+location.href;
      try{if(navigator.share)await navigator.share({title,text:msg,url:location.href});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(msg);share.textContent='Result copied!';setTimeout(()=>share.textContent='Share result',2200)}else window.prompt('Copy your result:',msg)}catch(e){if(e?.name!=='AbortError')window.prompt('Copy your result:',msg)}
    });
  }
  function ensureInstall(){
    if(!('serviceWorker' in navigator) || location.protocol!=='https:')return;
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  function run(){enhanceSignup();enhanceResult();ensureInstall()}
  const observer=new MutationObserver(()=>{if(enhanceQueued)return;enhanceQueued=true;queueMicrotask(()=>{enhanceQueued=false;run()})});
  observer.observe(app,{childList:true,subtree:true});
  run();
})();
</script>

<style id="password-visibility-eye-styles">
.password-field{position:relative;width:100%;display:block;margin:0 0 14px}
.password-field .inp{width:100%;box-sizing:border-box;padding-right:52px!important;margin-bottom:0!important}
.password-visibility{position:absolute;right:7px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--muted,#77748a);cursor:pointer;z-index:2}
.password-visibility:hover{background:rgba(110,95,190,.10);color:var(--text,#35334a)}
.password-visibility:focus-visible{outline:2px solid var(--primary,#6b5bd2);outline-offset:1px}
.password-visibility svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.password-visibility .eye-slash{display:none}
.password-visibility[aria-pressed="true"] .eye-slash{display:block}
.password-visibility[aria-pressed="true"] .eye-open{display:none}
</style>
<script>
function togglePasswordVisibility(id,button){
  const input=document.getElementById(id);
  if(!input)return;
  const show=input.type==="password";
  input.type=show?"text":"password";
  button.setAttribute("aria-pressed",String(show));
  button.setAttribute("aria-label",show?"Hide password":"Show password");
  button.title=show?"Hide password":"Show password";
  button.innerHTML=show
    ? '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.7 2.7"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.3C3.5 8.1 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 3.2-.5"/></svg>'
    : '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
}
</script>
